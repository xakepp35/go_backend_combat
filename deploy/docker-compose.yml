name: combat-core
services:
  postgres:
    image: postgres:18.0-alpine
    environment:
      POSTGRES_DB: jobflow
      POSTGRES_USER: jobflow
      POSTGRES_PASSWORD: jobflow
    ports: ["127.0.0.1:${POSTGRES_PORT:-15432}:5432"]
    volumes: ["pg:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobflow -d jobflow"]
      interval: 2s
      timeout: 2s
      retries: 30
  app:
    build: ../reference/24
    environment:
      DATABASE_URL: postgres://jobflow:jobflow@postgres:5432/jobflow?sslmode=disable
      HTTP_ADDR: :8080
      WORKER_COUNT: '2'
    ports: ["127.0.0.1:${HTTP_PORT:-8080}:8080"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  pg:
