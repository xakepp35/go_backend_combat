name: jobflow
services:
  postgres:
    image: postgres:18.0-alpine
    environment:
      POSTGRES_DB: jobflow
      POSTGRES_USER: jobflow
      POSTGRES_PASSWORD: jobflow
    ports: ["127.0.0.1:${POSTGRES_PORT:-15432}:5432"]
    volumes: ["pg:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobflow -d jobflow"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:8.2.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:${REDIS_PORT:-16379}:6379"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  redpanda:
    image: redpandadata/redpanda:v25.2.9
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:${KAFKA_PORT:-19092}
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    ports: ["127.0.0.1:${KAFKA_PORT:-19092}:19092"]
    volumes: ["kafka:/var/lib/redpanda/data"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --api-urls localhost:9644 | grep -q 'Healthy:.*true'"]
      interval: 3s
      timeout: 3s
      retries: 40
  redpanda-init:
    image: redpandadata/redpanda:v25.2.9
    depends_on:
      redpanda: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-ec"]
    command: ["rpk topic describe job.events --brokers redpanda:9092 >/dev/null 2>&1 || rpk topic create job.events --brokers redpanda:9092 --partitions 3 --replicas 1"]
  pub:
    profiles: [app]
    build: {context: "${JOBFLOW_PROJECT:-../reference/24}"}
    image: "jobflow-course:${JOBFLOW_IMAGE_TAG:-local}"
    command: ["pub"]
    environment: &appenv
      DATABASE_URL: postgres://jobflow:jobflow@postgres:5432/jobflow?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: job.events
      KAFKA_GROUP: jobflow-sub
      PUB_URL: http://pub:8080
      HTTP_ADDR: :8080
      JF_NAMESPACE: jobflow
    ports: ["127.0.0.1:${HTTP_PORT:-8080}:8080"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30
  sub:
    profiles: [app]
    image: "jobflow-course:${JOBFLOW_IMAGE_TAG:-local}"
    command: ["sub"]
    environment: *appenv
    depends_on:
      pub: {condition: service_healthy}
      redis: {condition: service_healthy}
      redpanda-init: {condition: service_completed_successfully}
  act:
    profiles: [app]
    image: "jobflow-course:${JOBFLOW_IMAGE_TAG:-local}"
    command: ["act"]
    environment:
      <<: *appenv
      WORKER_COUNT: "2"
    depends_on:
      pub: {condition: service_healthy}
      redis: {condition: service_healthy}
  ret:
    profiles: [app]
    image: "jobflow-course:${JOBFLOW_IMAGE_TAG:-local}"
    command: ["ret"]
    environment: *appenv
    depends_on:
      pub: {condition: service_healthy}
volumes:
  pg:
  redis:
  kafka:
