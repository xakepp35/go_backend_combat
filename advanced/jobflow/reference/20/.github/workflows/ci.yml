name: JobFlow
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache: false
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
