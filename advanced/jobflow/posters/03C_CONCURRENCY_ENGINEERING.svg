<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
<title>03C. CONCURRENCY ENGINEERING</title>
<desc>Системная модель concurrent backend: load, bounds, distribution, control, shutdown and verification.</desc>
<defs><style>
.bg{fill:#0B0D10}.card{fill:#11171D;stroke:#3E4853;stroke-width:.8}.inner{fill:#151B21;stroke:#46515C;stroke-width:.7}.t{fill:#F3F6F8;font-family:Inter,"Segoe UI",Arial,sans-serif}.m{fill:#A2ABB5;font-family:Inter,"Segoe UI",Arial,sans-serif}.a{fill:#7DD3FC}.as{stroke:#7DD3FC;fill:none;stroke-linecap:round;stroke-linejoin:round}.r{stroke:#2A3037;stroke-width:.7}
.title{font-size:17px;font-weight:700;letter-spacing:1.3px}.sub{font-size:4.8px;font-weight:500}.num{font-size:7px;font-weight:800}.ct{font-size:5.9px;font-weight:700;letter-spacing:.5px}.q{font-size:4.15px;font-weight:500}.e{font-size:3.75px;font-weight:500}.f{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:3.5px;font-weight:600}.tag{font-size:3.05px;font-weight:700;letter-spacing:.5px}.hero{font-size:6.4px;font-weight:800;letter-spacing:.4px}
</style><marker id="ar" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" class="a"/></marker></defs>
<rect width="420" height="297" class="bg"/>

<!-- Header -->
<text x="18" y="27" class="t title">CONCURRENCY ENGINEERING</text>
<a href="https://github.com/xakepp35/go_backend_combat"><text x="402" y="27" text-anchor="end" class="t sub">github.com/xakepp35/go_backend_combat</text></a>
<text x="18" y="36" class="m sub">Concurrent-система должна ограничивать работу, управлять жизненным циклом и делать поведение наблюдаемым.</text>
<line x1="18" y1="44" x2="402" y2="44" class="r"/>

<!-- Flow: 1 → 2 → 3 ↘ 4 → 5 → 6 -->
<path d="M134 106H152" class="as" stroke-width="1.9" marker-end="url(#ar)"/>
<path d="M268 106H286" class="as" stroke-width="1.9" marker-end="url(#ar)"/>
<path d="M344 162V168H76V174" class="as" stroke-width="1.9" marker-end="url(#ar)"/>
<path d="M134 229H152" class="as" stroke-width="1.9" marker-end="url(#ar)"/>
<path d="M268 229H286" class="as" stroke-width="1.9" marker-end="url(#ar)"/>

<!-- 1 LOAD -->
<g><rect x="18" y="51" width="116" height="111" rx="2" class="card"/>
<text x="26" y="66" class="a num">01.</text><text x="39" y="66" class="t ct">LOAD</text>
<line x1="26" y1="73" x2="126" y2="73" class="r"/>
<text x="26" y="88" class="m q">Сколько работы приходит и с какой скоростью?</text>
<text x="26" y="101" class="a tag">INPUT</text>
<text x="26" y="112" class="m f">rate · burst · cost</text>
<text x="26" y="126" class="m e">Нагрузка определяется не только числом</text>
<text x="26" y="132" class="m e">запросов, но и стоимостью одной работы.</text>
<text x="26" y="146" class="a tag">ПРИМЕР</text>
<text x="26" y="156" class="m f">100 000 jobs/min</text></g>

<!-- 2 BOUND -->
<g><rect x="152" y="51" width="116" height="111" rx="2" class="card"/>
<text x="160" y="66" class="a num">02.</text><text x="173" y="66" class="t ct">BOUND</text>
<line x1="160" y1="73" x2="260" y2="73" class="r"/>
<text x="160" y="88" class="m q">Сколько работы можно выполнять одновременно?</text>
<text x="160" y="101" class="a tag">LIMITS</text>
<text x="160" y="112" class="m f">workers · in-flight · queue</text>
<text x="160" y="126" class="m e">Количество concurrent work — явный ресурсный</text>
<text x="160" y="132" class="m e">лимит, а не функция размера входной очереди.</text>
<text x="160" y="146" class="a tag">ПРИМЕР</text>
<text x="160" y="156" class="m f">1 000 000 jobs → 32 workers</text></g>

<!-- 3 DISTRIBUTE -->
<g><rect x="286" y="51" width="116" height="111" rx="2" class="card"/>
<text x="294" y="66" class="a num">03.</text><text x="307" y="66" class="t ct">DISTRIBUTE</text>
<line x1="294" y1="73" x2="394" y2="73" class="r"/>
<text x="294" y="88" class="m q">Как распределить работу между workers?</text>
<text x="294" y="101" class="a tag">MODEL</text>
<rect x="294" y="109" width="35" height="18" rx="1.2" class="inner"/><text x="311" y="121" text-anchor="middle" class="t e">QUEUE</text>
<path d="M329 118H337" class="as" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="339" y="106" width="18" height="24" rx="1.2" class="inner"/><text x="348" y="120" text-anchor="middle" class="t e">W1</text>
<rect x="359" y="106" width="18" height="24" rx="1.2" class="inner"/><text x="368" y="120" text-anchor="middle" class="t e">W2</text>
<rect x="379" y="106" width="18" height="24" rx="1.2" class="inner"/><text x="388" y="120" text-anchor="middle" class="t e">W3</text>
<text x="294" y="144" class="m e">Worker pool: фиксированное число workers.</text>
<text x="294" y="151" class="m e">Fan-out → работа. Fan-in → результаты.</text></g>

<!-- 4 CONTROL -->
<g><rect x="18" y="174" width="116" height="111" rx="2" class="card"/>
<text x="26" y="189" class="a num">04.</text><text x="39" y="189" class="t ct">CONTROL</text>
<line x1="26" y1="196" x2="126" y2="196" class="r"/>
<text x="26" y="211" class="m q">Что делать при timeout, перегрузке или ошибке?</text>
<text x="26" y="224" class="a tag">POLICY</text>
<text x="26" y="235" class="t e">TIMEOUT → ограничить ожидание</text>
<text x="26" y="242" class="t e">CANCEL → прекратить ненужную работу</text>
<text x="26" y="249" class="t e">BACKPRESSURE → замедлить вход</text>
<text x="26" y="256" class="t e">FAILURE → retry / reject / fallback</text>
<text x="26" y="270" class="a tag">ПРИНЦИП</text>
<text x="26" y="279" class="m e">Каждый overload и отказ имеет определённую policy.</text></g>

<!-- 5 STOP -->
<g><rect x="152" y="174" width="116" height="111" rx="2" class="card"/>
<text x="160" y="189" class="a num">05.</text><text x="173" y="189" class="t ct">STOP</text>
<line x1="160" y1="196" x2="260" y2="196" class="r"/>
<text x="160" y="211" class="m q">Как система завершает работу?</text>
<text x="160" y="224" class="a tag">SHUTDOWN</text>
<text x="160" y="235" class="t e">STOP ACCEPTING</text>
<text x="160" y="242" class="t e">↓ CANCEL</text>
<text x="160" y="249" class="t e">↓ FINISH ALLOWED WORK</text>
<text x="160" y="256" class="t e">↓ WAIT</text>
<text x="160" y="263" class="t e">↓ EXIT</text>
<text x="160" y="275" class="a tag">LIFECYCLE</text>
<text x="160" y="282" class="m e">Каждый worker и queue имеют путь выхода.</text></g>

<!-- 6 VERIFY -->
<g><rect x="286" y="174" width="116" height="111" rx="2" class="card"/>
<text x="294" y="189" class="a num">06.</text><text x="307" y="189" class="t ct">VERIFY</text>
<line x1="294" y1="196" x2="394" y2="196" class="r"/>
<text x="294" y="211" class="m q">Как доказать, что система под контролем?</text>
<text x="294" y="224" class="a tag">PASS</text>
<text x="294" y="235" class="t e">CORRECTNESS → результат верен</text>
<text x="294" y="242" class="t e">CONCURRENCY → bounded</text>
<text x="294" y="249" class="t e">LATENCY → измеряется</text>
<text x="294" y="256" class="t e">RESOURCES → bounded</text>
<text x="294" y="263" class="t e">SHUTDOWN → проверен</text>
<text x="294" y="275" class="a tag">OBSERVABILITY</text>
<text x="294" y="282" class="m f">metrics · logs · traces · profiles</text></g>

<!-- Failure strip -->
<line x1="18" y1="290" x2="402" y2="290" class="r"/>
<text x="18" y="296" class="a tag">FAILURE MODES</text>
<text x="111" y="296" class="m e">RACE · DEADLOCK · LEAK · OVERLOAD</text>
<text x="402" y="296" text-anchor="end" class="m e">detect · bound · recover</text>
</svg>