<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
<title>06B. DELIVERY &amp; MESSAGING</title>
<desc>Семантика доставки сообщений: at-most-once, at-least-once, exactly-once, offset, ordering и consumer groups.</desc>
<defs><style>
.bg{fill:#0B0D10}.card{fill:#11171D;stroke:#3E4853;stroke-width:.8}.inner{fill:#151B21;stroke:#46515C;stroke-width:.7}.t{fill:#F3F6F8;font-family:Inter,"Segoe UI",Arial,sans-serif}.m{fill:#A2ABB5;font-family:Inter,"Segoe UI",Arial,sans-serif}.a{fill:#7DD3FC}.as{stroke:#7DD3FC;fill:none;stroke-linecap:round;stroke-linejoin:round}.r{stroke:#2A3037;stroke-width:.7}
.title{font-size:17px;font-weight:700;letter-spacing:1.25px}.sub{font-size:4.75px;font-weight:500}.num{font-size:7px;font-weight:800}.ct{font-size:5.7px;font-weight:700;letter-spacing:.45px}.q{font-size:4.05px;font-weight:500}.e{font-size:3.65px;font-weight:500}.f{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:3.4px;font-weight:600}.tag{font-size:3px;font-weight:700;letter-spacing:.45px}.big{font-size:7.7px;font-weight:800}.hero{font-size:6.1px;font-weight:800;letter-spacing:.3px}
</style><marker id="ar" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" class="a"/></marker></defs>
<rect width="420" height="297" class="bg"/>

<!-- Header -->
<text x="18" y="27" class="t title">DELIVERY &amp; MESSAGING</text>
<a href="https://github.com/xakepp35/go_backend_combat"><text x="402" y="27" text-anchor="end" class="m sub">github.com/xakepp35/go_backend_combat</text></a>
<text x="18" y="36" class="m sub">Семантика доставки: когда сообщение считается доставленным, что может повториться и где существует порядок.</text>
<line x1="18" y1="44" x2="402" y2="44" class="r"/>

<!-- Flow: 1 → 2 → 3 ↘ 4 → 5 → 6 -->
<path d="M134 106H152M268 106H286M344 162V168H76V174M134 229H152M268 229H286" class="as" stroke-width="1.9" marker-end="url(#ar)"/>

<!-- 1 AT-MOST-ONCE -->
<g><rect x="18" y="51" width="116" height="111" rx="2" class="card"/>
<text x="26" y="66" class="a num">01.</text><text x="39" y="66" class="t ct">AT-MOST-ONCE</text>
<line x1="26" y1="73" x2="126" y2="73" class="r"/>
<text x="26" y="88" class="m q">Что гарантирует «не более одного раза»?</text>
<text x="26" y="101" class="a tag">SEMANTICS</text>
<text x="26" y="112" class="m f">message → deliver → process?</text>
<text x="26" y="125" class="m e">Повторная обработка не гарантируется,</text>
<text x="26" y="132" class="m e">но сообщение может быть потеряно.</text>
<text x="26" y="147" class="a tag">TRADE-OFF</text>
<text x="26" y="157" class="t e">LOSS допустим.</text></g>

<!-- 2 AT-LEAST-ONCE -->
<g><rect x="152" y="51" width="116" height="111" rx="2" class="card"/>
<text x="160" y="66" class="a num">02.</text><text x="173" y="66" class="t ct">AT-LEAST-ONCE</text>
<line x1="160" y1="73" x2="260" y2="73" class="r"/>
<text x="160" y="88" class="m q">Что гарантирует «как минимум один раз»?</text>
<text x="160" y="101" class="a tag">SEMANTICS</text>
<text x="160" y="112" class="m f">process → ACK → crash?</text>
<text x="160" y="124" class="m f">process → crash → redelivery</text>
<text x="160" y="139" class="m e">Потеря не является нормальным результатом</text>
<text x="160" y="146" class="m e">успешно зафиксированной доставки.</text>
<text x="160" y="158" class="a tag">ЦЕНА</text><text x="196" y="158" class="t e">DUPLICATE POSSIBLE</text></g>

<!-- 3 EXACTLY-ONCE -->
<g><rect x="286" y="51" width="116" height="111" rx="2" class="card"/>
<text x="294" y="66" class="a num">03.</text><text x="307" y="66" class="t ct">EXACTLY-ONCE</text>
<line x1="294" y1="73" x2="394" y2="73" class="r"/>
<text x="294" y="88" class="m q">Где находится граница exactly-once?</text>
<text x="294" y="101" class="a tag">BOUNDARY</text>
<text x="294" y="112" class="m f">MESSAGE + STATE + EFFECT</text>
<text x="294" y="126" class="m e">Exactly-once не означает, что consumer</text>
<text x="294" y="133" class="m e">никогда физически не запустит код повторно.</text>
<text x="294" y="147" class="a tag">КЛЮЧ</text>
<text x="294" y="157" class="t e">Гарантия определяется границей эффекта.</text></g>

<!-- 4 ACK / OFFSET -->
<g><rect x="18" y="174" width="116" height="111" rx="2" class="card"/>
<text x="26" y="189" class="a num">04.</text><text x="39" y="189" class="t ct">ACK / OFFSET</text>
<line x1="26" y1="196" x2="126" y2="196" class="r"/>
<text x="26" y="211" class="m q">Когда можно считать сообщение обработанным?</text>
<text x="26" y="224" class="a tag">ПОРЯДОК ВАЖЕН</text>
<text x="26" y="235" class="m f">process → commit offset</text>
<text x="26" y="245" class="m e">Если offset зафиксирован раньше effect:</text>
<text x="26" y="252" class="m f">offset ✓ → crash → effect ✗</text>
<text x="26" y="267" class="m e">Если effect раньше offset:</text>
<text x="26" y="274" class="m f">effect ✓ → crash → redelivery</text>
<text x="26" y="286" class="a tag">SEMANTICS</text></g>

<!-- 5 PARTITION / ORDER -->
<g><rect x="152" y="174" width="116" height="111" rx="2" class="card"/>
<text x="160" y="189" class="a num">05.</text><text x="173" y="189" class="t ct">PARTITION / ORDER</text>
<line x1="160" y1="196" x2="260" y2="196" class="r"/>
<text x="160" y="211" class="m q">Где существует порядок сообщений?</text>
<text x="160" y="224" class="a tag">TOPIC</text>
<text x="160" y="235" class="m f">P0: 1 2 3 4</text>
<text x="160" y="243" class="m f">P1: 5 6 7</text>
<text x="160" y="251" class="m f">P2: 8 9</text>
<text x="160" y="264" class="a tag">KEY</text>
<text x="160" y="274" class="m e">Один key можно направить в одну</text>
<text x="160" y="281" class="m e">partition и сохранить порядок для key.</text></g>

<!-- 6 CONSUMER GROUP -->
<g><rect x="286" y="174" width="116" height="111" rx="2" class="card"/>
<text x="294" y="189" class="a num">06.</text><text x="307" y="189" class="t ct">CONSUMER GROUP</text>
<line x1="294" y1="196" x2="394" y2="196" class="r"/>
<text x="294" y="211" class="m q">Как распределяется параллельная обработка?</text>
<text x="294" y="224" class="a tag">PARTITIONS</text>
<text x="294" y="235" class="m f">P0 → C1</text>
<text x="294" y="243" class="m f">P1 → C2</text>
<text x="294" y="251" class="m f">P2 → C3</text>
<text x="294" y="264" class="m e">Внутри consumer group partition</text>
<text x="294" y="271" class="m e">назначается одному consumer.</text>
<text x="294" y="281" class="a tag">BOUND</text>
<text x="328" y="281" class="m e">parallelism связан с partitions.</text></g>
</svg>