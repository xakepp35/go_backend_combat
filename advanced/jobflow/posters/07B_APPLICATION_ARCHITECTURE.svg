<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
<title>07B. APPLICATION ARCHITECTURE</title>
<desc>Архитектура JobFlow: transport → application → domain, ports и adapters, dependency direction.</desc>
<defs><style>
.bg{fill:#0B0D10}.card{fill:#11171D;stroke:#3E4853;stroke-width:.8}.inner{fill:#151B21;stroke:#46515C;stroke-width:.7}.t{fill:#F3F6F8;font-family:Inter,"Segoe UI",Arial,sans-serif}.m{fill:#A2ABB5;font-family:Inter,"Segoe UI",Arial,sans-serif}.a{fill:#7DD3FC}.as{stroke:#7DD3FC;fill:none;stroke-linecap:round;stroke-linejoin:round}.r{stroke:#2A3037;stroke-width:.7}
.title{font-size:17px;font-weight:700;letter-spacing:1.25px}.sub{font-size:4.7px;font-weight:500}.num{font-size:7px;font-weight:800}.ct{font-size:5.7px;font-weight:700;letter-spacing:.45px}.q{font-size:4.05px;font-weight:500}.e{font-size:3.65px;font-weight:500}.f{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:3.4px;font-weight:600}.tag{font-size:3px;font-weight:700;letter-spacing:.45px}.hero{font-size:6.1px;font-weight:800;letter-spacing:.3px}
</style><marker id="ar" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" class="a"/></marker></defs>
<rect width="420" height="297" class="bg"/>

<!-- Header -->
<text x="18" y="27" class="t title">APPLICATION ARCHITECTURE</text>
<a href="https://github.com/xakepp35/go_backend_combat"><text x="402" y="27" text-anchor="end" class="m sub">github.com/xakepp35/go_backend_combat</text></a>
<text x="18" y="36" class="m sub">Transport адаптирует протокол. Application принимает решение. Infrastructure реализует детали.</text>
<line x1="18" y1="44" x2="402" y2="44" class="r"/>

<!-- Flow: 1 → 2 → 3 ↘ 4 → 5 → 6 -->
<path d="M134 106H152M268 106H286M344 162V168H76V174M134 229H152M268 229H286" class="as" stroke-width="1.9" marker-end="url(#ar)"/>

<!-- 1 TRANSPORT -->
<g><rect x="18" y="51" width="116" height="111" rx="2" class="card"/>
<text x="26" y="66" class="a num">01.</text><text x="39" y="66" class="t ct">TRANSPORT</text>
<line x1="26" y1="73" x2="126" y2="73" class="r"/>
<text x="26" y="88" class="m q">Кто переводит внешний протокол во внутренний command?</text>
<text x="26" y="101" class="a tag">ADAPTER</text>
<text x="26" y="112" class="m f">HTTP / gRPC / Kafka / CLI</text>
<text x="26" y="126" class="m f">request DTO → command</text>
<text x="26" y="140" class="m e">Transport знает формат и protocol details.</text>
<text x="26" y="148" class="m e">Application не обязан знать HTTP.</text>
<text x="26" y="159" class="a tag">BOUNDARY</text></g>

<!-- 2 APPLICATION -->
<g><rect x="152" y="51" width="116" height="111" rx="2" class="card"/>
<text x="160" y="66" class="a num">02.</text><text x="173" y="66" class="t ct">APPLICATION</text>
<line x1="160" y1="73" x2="260" y2="73" class="r"/>
<text x="160" y="88" class="m q">Где находится use case и решение системы?</text>
<text x="160" y="101" class="a tag">POLICY</text>
<text x="160" y="112" class="m f">command</text>
<text x="160" y="120" class="m f">→ validate</text>
<text x="160" y="128" class="m f">→ decide</text>
<text x="160" y="136" class="m f">→ change state</text>
<text x="160" y="144" class="m f">→ emit effect</text>
<text x="160" y="157" class="m e">Use case координирует policy,</text>
<text x="160" y="164" class="m e">но не реализует инфраструктуру.</text></g>

<!-- 3 DOMAIN -->
<g><rect x="286" y="51" width="116" height="111" rx="2" class="card"/>
<text x="294" y="66" class="a num">03.</text><text x="307" y="66" class="t ct">DOMAIN</text>
<line x1="294" y1="73" x2="394" y2="73" class="r"/>
<text x="294" y="88" class="m q">Какие правила состояния нельзя нарушить?</text>
<text x="294" y="101" class="a tag">JOB</text>
<text x="294" y="112" class="m f">pending → running</text>
<text x="294" y="120" class="m f">running → completed</text>
<text x="294" y="128" class="m f">running → failed</text>
<text x="294" y="142" class="a tag">INVARIANTS</text>
<text x="294" y="152" class="m e">Domain описывает состояние и transitions.</text>
<text x="294" y="159" class="m e">Он не знает HTTP, PostgreSQL или Kafka.</text></g>

<!-- 4 PORTS -->
<g><rect x="18" y="174" width="116" height="111" rx="2" class="card"/>
<text x="26" y="189" class="a num">04.</text><text x="39" y="189" class="t ct">PORTS</text>
<line x1="26" y1="196" x2="126" y2="196" class="r"/>
<text x="26" y="211" class="m q">Какое минимальное поведение нужно policy?</text>
<text x="26" y="224" class="a tag">CONTRACTS</text>
<text x="26" y="235" class="m f">JobRepository</text>
<text x="26" y="243" class="m f">EventPublisher</text>
<text x="26" y="251" class="m f">JobCache</text>
<text x="26" y="264" class="a tag">GO</text>
<text x="26" y="274" class="m f">consumer-side interfaces</text>
<text x="26" y="283" class="m e">Port описывает нужное поведение,</text>
<text x="26" y="290" class="m e">а не возможности конкретной технологии.</text></g>

<!-- 5 ADAPTERS -->
<g><rect x="152" y="174" width="116" height="111" rx="2" class="card"/>
<text x="160" y="189" class="a num">05.</text><text x="173" y="189" class="t ct">ADAPTERS</text>
<line x1="160" y1="196" x2="260" y2="196" class="r"/>
<text x="160" y="211" class="m q">Где живут конкретные технологии?</text>
<text x="160" y="224" class="a tag">IMPLEMENTATIONS</text>
<text x="160" y="235" class="m f">PostgresRepository</text>
<text x="160" y="243" class="m f">KafkaPublisher</text>
<text x="160" y="251" class="m f">RedisCache</text>
<text x="160" y="259" class="m f">HTTPHandler</text>
<text x="160" y="267" class="m f">KafkaConsumer</text>
<text x="160" y="280" class="a tag">RULE</text>
<text x="160" y="289" class="m e">Adapter знает технологию.</text></g>

<!-- 6 DEPENDENCY DIRECTION -->
<g><rect x="286" y="174" width="116" height="111" rx="2" class="card"/>
<text x="294" y="189" class="a num">06.</text><text x="307" y="189" class="t ct">DEPENDENCY DIRECTION</text>
<line x1="294" y1="196" x2="394" y2="196" class="r"/>
<text x="294" y="211" class="m q">Куда должна быть направлена зависимость?</text>
<text x="294" y="224" class="a tag">POLICY</text>
<rect x="294" y="231" width="100" height="19" rx="1.4" class="inner"/>
<text x="344" y="244" text-anchor="middle" class="t hero">APPLICATION POLICY</text>
<path d="M344 250V258" class="as" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="294" y="260" width="100" height="19" rx="1.4" class="inner"/>
<text x="344" y="273" text-anchor="middle" class="t hero">STABLE CONTRACT</text>
<text x="294" y="290" class="m e">Concrete infrastructure plugs into the contract.</text></g>
</svg>