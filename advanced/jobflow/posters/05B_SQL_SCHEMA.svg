<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
<title>05B. SQL &amp; SCHEMA</title>
<desc>PostgreSQL: миграция → схема → SQL → индекс → план запроса.</desc>
<defs><style>
.bg{fill:#0B0D10}.card{fill:#11171D;stroke:#3E4853;stroke-width:.8}.inner{fill:#151B21;stroke:#46515C;stroke-width:.7}.t{fill:#F3F6F8;font-family:Inter,"Segoe UI",Arial,sans-serif}.m{fill:#A2ABB5;font-family:Inter,"Segoe UI",Arial,sans-serif}.a{fill:#7DD3FC}.as{stroke:#7DD3FC;fill:none;stroke-linecap:round;stroke-linejoin:round}.r{stroke:#2A3037;stroke-width:.7}
.title{font-size:17px;font-weight:700;letter-spacing:1.3px}.sub{font-size:4.75px;font-weight:500}.num{font-size:7px;font-weight:800}.ct{font-size:5.8px;font-weight:700;letter-spacing:.48px}.q{font-size:4.05px;font-weight:500}.e{font-size:3.7px;font-weight:500}.f{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:3.35px;font-weight:600}.tag{font-size:3px;font-weight:700;letter-spacing:.45px}.big{font-size:7.8px;font-weight:800}.hero{font-size:6.3px;font-weight:800;letter-spacing:.4px}
</style><marker id="ar" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" class="a"/></marker></defs>
<rect width="420" height="297" class="bg"/>

<!-- Header -->
<text x="18" y="27" class="t title">SQL &amp; SCHEMA</text>
<a href="https://github.com/xakepp35/go_backend_combat"><text x="402" y="27" text-anchor="end" class="m sub">github.com/xakepp35/go_backend_combat</text></a>
<text x="18" y="36" class="m sub">Модель → миграция → SQL → индекс → план запроса.</text>
<line x1="18" y1="44" x2="402" y2="44" class="r"/>

<!-- Flow: 1 → 2 → 3 ↘ 4 → 5 → 6 -->
<path d="M134 106H152" class="as" stroke-width="1.9" marker-end="url(#ar)"/>
<path d="M268 106H286" class="as" stroke-width="1.9" marker-end="url(#ar)"/>
<path d="M344 162V168H76V174" class="as" stroke-width="1.9" marker-end="url(#ar)"/>
<path d="M134 229H152" class="as" stroke-width="1.9" marker-end="url(#ar)"/>
<path d="M268 229H286" class="as" stroke-width="1.9" marker-end="url(#ar)"/>

<!-- 1 MIGRATION -->
<g><rect x="18" y="51" width="116" height="111" rx="2" class="card"/>
<text x="26" y="66" class="a num">01.</text><text x="39" y="66" class="t ct">MIGRATION</text>
<line x1="26" y1="73" x2="126" y2="73" class="r"/>
<text x="26" y="88" class="m q">Как изменить схему воспроизводимо?</text>
<text x="26" y="101" class="a tag">VERSIONED STATE</text>
<text x="26" y="112" class="m f">001 → 002 → 003 → 004</text>
<text x="26" y="126" class="m e">Каждое изменение схемы — отдельный</text>
<text x="26" y="133" class="m e">versioned шаг, который можно применить</text>
<text x="26" y="140" class="m e">к чистой базе и воспроизвести.</text>
<text x="26" y="154" class="a tag">SQL</text>
<text x="26" y="160" class="m f">ALTER TABLE jobs ...</text></g>

<!-- 2 SCHEMA -->
<g><rect x="152" y="51" width="116" height="111" rx="2" class="card"/>
<text x="160" y="66" class="a num">02.</text><text x="173" y="66" class="t ct">SCHEMA</text>
<line x1="160" y1="73" x2="260" y2="73" class="r"/>
<text x="160" y="88" class="m q">Как выразить модель данных в PostgreSQL?</text>
<text x="160" y="101" class="a tag">DDL</text>
<text x="160" y="112" class="m f">CREATE TABLE jobs (</text>
<text x="160" y="119" class="m f">id UUID PRIMARY KEY,</text>
<text x="160" y="126" class="m f">type text NOT NULL,</text>
<text x="160" y="133" class="m f">payload jsonb NOT NULL,</text>
<text x="160" y="140" class="m f">status text NOT NULL</text>
<text x="160" y="147" class="m f">);</text>
<text x="160" y="158" class="m e">DDL связывает структуру таблицы</text>
<text x="160" y="164" class="m e">с инвариантами модели.</text></g>

<!-- 3 SQL -->
<g><rect x="286" y="51" width="116" height="111" rx="2" class="card"/>
<text x="294" y="66" class="a num">03.</text><text x="307" y="66" class="t ct">SQL</text>
<line x1="294" y1="73" x2="394" y2="73" class="r"/>
<text x="294" y="88" class="m q">Как читать и менять состояние?</text>
<text x="294" y="101" class="a tag">DML</text>
<text x="294" y="112" class="m f">INSERT INTO jobs (...) ...</text>
<text x="294" y="120" class="m f">SELECT ... FROM jobs ...</text>
<text x="294" y="128" class="m f">UPDATE jobs SET ... WHERE ...</text>
<text x="294" y="136" class="m f">DELETE FROM jobs WHERE ...</text>
<text x="294" y="150" class="a tag">JOIN</text>
<text x="294" y="160" class="m f">jobs JOIN job_attempts</text></g>

<!-- 4 QUERY -->
<g><rect x="18" y="174" width="116" height="111" rx="2" class="card"/>
<text x="26" y="189" class="a num">04.</text><text x="39" y="189" class="t ct">QUERY</text>
<line x1="26" y1="196" x2="126" y2="196" class="r"/>
<text x="26" y="211" class="m q">Как получить ровно нужное состояние?</text>
<text x="26" y="224" class="a tag">SELECT</text>
<text x="26" y="235" class="m f">SELECT j.id, j.status, a.attempt</text>
<text x="26" y="242" class="m f">FROM jobs j</text>
<text x="26" y="249" class="m f">JOIN job_attempts a</text>
<text x="26" y="256" class="m f">ON a.job_id = j.id</text>
<text x="26" y="263" class="m f">WHERE j.status = 'running';</text>
<text x="26" y="276" class="a tag">ПРИНЦИП</text>
<text x="26" y="283" class="m e">Пиши запрос под контракт данных,</text>
<text x="26" y="289" class="m e">а не под случайную структуру кода.</text></g>

<!-- 5 INDEX -->
<g><rect x="152" y="174" width="116" height="111" rx="2" class="card"/>
<text x="160" y="189" class="a num">05.</text><text x="173" y="189" class="t ct">INDEX</text>
<line x1="160" y1="196" x2="260" y2="196" class="r"/>
<text x="160" y="211" class="m q">Как ускорить повторяемый access pattern?</text>
<text x="160" y="224" class="a tag">SQL</text>
<text x="160" y="235" class="m f">CREATE INDEX idx_jobs_status</text>
<text x="160" y="242" class="m f">ON jobs(status);</text>
<text x="160" y="256" class="m e">Индекс ускоряет подходящие запросы,</text>
<text x="160" y="263" class="m e">но стоит памяти и записи.</text>
<text x="160" y="276" class="a tag">ВОПРОС</text>
<text x="160" y="285" class="m e">Какой WHERE / JOIN мы ускоряем?</text></g>

<!-- 6 PLAN -->
<g><rect x="286" y="174" width="116" height="111" rx="2" class="card"/>
<text x="294" y="189" class="a num">06.</text><text x="307" y="189" class="t ct">PLAN</text>
<line x1="294" y1="196" x2="394" y2="196" class="r"/>
<text x="294" y="211" class="m q">Как PostgreSQL реально выполнит запрос?</text>
<text x="294" y="224" class="a tag">EXPLAIN</text>
<text x="294" y="235" class="m f">EXPLAIN ANALYZE</text>
<text x="294" y="247" class="t e">Seq Scan</text>
<text x="294" y="254" class="t e">Index Scan</text>
<text x="294" y="261" class="t e">Nested Loop · Hash Join · Sort</text>
<text x="294" y="275" class="a tag">EVIDENCE</text>
<text x="294" y="284" class="m e">План запроса — наблюдаемое объяснение</text>
<text x="294" y="290" class="m e">того, как PostgreSQL ищет результат.</text></g>
</svg>