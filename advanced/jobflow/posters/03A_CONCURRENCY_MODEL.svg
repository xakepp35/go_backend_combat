<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
<title>03A. GO CONCURRENCY MODEL</title>
<desc>Семантическая модель конкурентности Go: ownership, goroutine, channel, select, synchronization и lifecycle</desc>
<defs><style>
.bg{fill:#0B0D10}.card{fill:#11171D;stroke:#3E4853;stroke-width:.8}.t{fill:#F3F6F8;font-family:Inter,"Segoe UI",Arial,sans-serif}.m{fill:#A2ABB5;font-family:Inter,"Segoe UI",Arial,sans-serif}.a{fill:#7DD3FC}.as{stroke:#7DD3FC;fill:none;stroke-linecap:round;stroke-linejoin:round}.r{stroke:#2A3037;stroke-width:.7}
.title{font-size:17px;font-weight:700;letter-spacing:1.3px}.sub{font-size:4.7px;font-weight:500}.num{font-size:6.8px;font-weight:800}.ct{font-size:5.8px;font-weight:700;letter-spacing:.5px}.q{font-size:4.15px;font-weight:500}.e{font-size:3.75px;font-weight:500}.f{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:3.45px;font-weight:600}.tag{font-size:3.05px;font-weight:700;letter-spacing:.5px}.hero{font-size:6.2px;font-weight:800;letter-spacing:.45px}
</style><marker id="ar" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" class="a"/></marker></defs>
<rect width="420" height="297" class="bg"/>

<!-- Header -->
<text x="18" y="27" class="t title">GO CONCURRENCY MODEL</text>
<a href="https://github.com/xakepp35/go_backend_combat"><text x="402" y="27" text-anchor="end" class="t sub">github.com/xakepp35/go_backend_combat</text></a>
<text x="18" y="36" class="m sub">Concurrency — управление взаимодействием, временем жизни и ограничением concurrent work.</text>
<line x1="18" y1="44" x2="402" y2="44" class="r"/>

<!-- Flow: 1 → 2 → 3 ↘ 4 → 5 → 6 -->
<path d="M134 106H152" class="as" stroke-width="1.9" marker-end="url(#ar)"/>
<path d="M268 106H286" class="as" stroke-width="1.9" marker-end="url(#ar)"/>
<path d="M344 162V168H76V174" class="as" stroke-width="1.9" marker-end="url(#ar)"/>
<path d="M134 229H152" class="as" stroke-width="1.9" marker-end="url(#ar)"/>
<path d="M268 229H286" class="as" stroke-width="1.9" marker-end="url(#ar)"/>

<!-- 1 OWNERSHIP -->
<g><rect x="18" y="51" width="116" height="111" rx="2" class="card"/>
<text x="26" y="66" class="a num">01.</text><text x="39" y="66" class="t ct">OWNERSHIP</text>
<line x1="26" y1="73" x2="126" y2="73" class="r"/>
<text x="26" y="88" class="m q">Кто владеет работой и её состоянием?</text>
<text x="26" y="101" class="a ct">MODEL</text>
<text x="26" y="111" class="m f">owner → goroutine → state</text>
<text x="26" y="124" class="m e">У concurrent operation есть понятный</text>
<text x="26" y="130" class="m e">владелец, который знает её lifecycle.</text>
<text x="26" y="143" class="a tag">ПРИНЦИП</text>
<text x="26" y="152" class="m e">Один владелец часто позволяет избежать</text>
<text x="26" y="158" class="m e">shared mutable state.</text></g>

<!-- 2 GOROUTINE -->
<g><rect x="152" y="51" width="116" height="111" rx="2" class="card"/>
<text x="160" y="66" class="a num">02.</text><text x="173" y="66" class="t ct">GOROUTINE</text>
<line x1="160" y1="73" x2="260" y2="73" class="r"/>
<text x="160" y="88" class="m q">Что выполняет независимую работу?</text>
<text x="160" y="101" class="a ct">GO</text>
<text x="160" y="112" class="m f">go process(job)</text>
<text x="160" y="124" class="m e">Goroutine — единица concurrent execution,</text>
<text x="160" y="130" class="m e">управляемая runtime.</text>
<text x="160" y="143" class="a tag">НЕ ПОТОК</text>
<text x="160" y="152" class="m e">Количество goroutines не равно числу</text>
<text x="160" y="158" class="m e">одновременно работающих OS threads.</text></g>

<!-- 3 CHANNEL -->
<g><rect x="286" y="51" width="116" height="111" rx="2" class="card"/>
<text x="294" y="66" class="a num">03.</text><text x="307" y="66" class="t ct">CHANNEL</text>
<line x1="294" y1="73" x2="394" y2="73" class="r"/>
<text x="294" y="88" class="m q">Как передавать данные между goroutines?</text>
<text x="294" y="101" class="a ct">GO</text>
<text x="294" y="112" class="m f">producer → chan → consumer</text>
<text x="294" y="124" class="m e">Channel передаёт значения и одновременно</text>
<text x="294" y="130" class="m e">может синхронизировать участников.</text>
<text x="294" y="143" class="a tag">НАПРАВЛЕНИЕ</text>
<text x="294" y="152" class="m f">chan&lt;- T → send</text>
<text x="294" y="158" class="m f">&lt;-chan T → receive</text></g>

<!-- 4 SELECT -->
<g><rect x="18" y="174" width="116" height="111" rx="2" class="card"/>
<text x="26" y="189" class="a num">04.</text><text x="39" y="189" class="t ct">SELECT</text>
<line x1="26" y1="196" x2="126" y2="196" class="r"/>
<text x="26" y="211" class="m q">Как ждать несколько concurrent events?</text>
<text x="26" y="224" class="a ct">GO</text>
<text x="26" y="234" class="m f">select {</text>
<text x="26" y="240" class="m f">case job := &lt;-jobs:</text>
<text x="26" y="246" class="m f">case &lt;-ctx.Done():</text>
<text x="26" y="252" class="m f">}</text>
<text x="26" y="265" class="a tag">СОБЫТИЯ</text>
<text x="26" y="274" class="m e">Работа · cancel · timeout · signal</text></g>

<!-- 5 SYNCHRONIZATION -->
<g><rect x="152" y="174" width="116" height="111" rx="2" class="card"/>
<text x="160" y="189" class="a num">05.</text><text x="173" y="189" class="t ct">SYNCHRONIZATION</text>
<line x1="160" y1="196" x2="260" y2="196" class="r"/>
<text x="160" y="211" class="m q">Что происходит с shared state?</text>
<text x="160" y="224" class="a ct">CHOICE</text>
<text x="160" y="234" class="m e">MUTEX → защищает составное состояние</text>
<text x="160" y="241" class="m e">ATOMIC → атомарная операция</text>
<text x="160" y="248" class="m e">CHANNEL → передача / coordination</text>
<text x="160" y="261" class="a tag">ИНВАРИАНТ</text>
<text x="160" y="270" class="m e">Concurrent access требует определённого</text>
<text x="160" y="276" class="m e">порядка и правил владения.</text></g>

<!-- 6 LIFECYCLE -->
<g><rect x="286" y="174" width="116" height="111" rx="2" class="card"/>
<text x="294" y="189" class="a num">06.</text><text x="307" y="189" class="t ct">LIFECYCLE</text>
<line x1="294" y1="196" x2="394" y2="196" class="r"/>
<text x="294" y="211" class="m q">Как concurrent operation завершится?</text>
<text x="294" y="224" class="a ct">FLOW</text>
<text x="294" y="234" class="m f">START → RUN → DONE</text>
<text x="294" y="241" class="m f">          ↘ CANCEL</text>
<text x="294" y="248" class="m f">          ↘ TIMEOUT</text>
<text x="294" y="255" class="m f">          ↘ ERROR</text>
<text x="294" y="267" class="a tag">STOP CONDITION</text>
<text x="294" y="276" class="m e">Каждая goroutine должна иметь путь выхода.</text></g>
</svg>