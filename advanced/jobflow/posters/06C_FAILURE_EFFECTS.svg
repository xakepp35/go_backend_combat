<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
<title>06C. FAILURE &amp; EFFECTS</title>
<desc>Распределённые отказы: idempotency, retry, backoff, state transitions, outbox и failure policy.</desc>
<defs><style>
.bg{fill:#0B0D10}.card{fill:#11171D;stroke:#3E4853;stroke-width:.8}.inner{fill:#151B21;stroke:#46515C;stroke-width:.7}.t{fill:#F3F6F8;font-family:Inter,"Segoe UI",Arial,sans-serif}.m{fill:#A2ABB5;font-family:Inter,"Segoe UI",Arial,sans-serif}.a{fill:#7DD3FC}.as{stroke:#7DD3FC;fill:none;stroke-linecap:round;stroke-linejoin:round}.r{stroke:#2A3037;stroke-width:.7}
.title{font-size:17px;font-weight:700;letter-spacing:1.25px}.sub{font-size:4.7px;font-weight:500}.num{font-size:7px;font-weight:800}.ct{font-size:5.7px;font-weight:700;letter-spacing:.45px}.q{font-size:4.05px;font-weight:500}.e{font-size:3.65px;font-weight:500}.f{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:3.4px;font-weight:600}.tag{font-size:3px;font-weight:700;letter-spacing:.45px}.big{font-size:7.8px;font-weight:800}.hero{font-size:6.2px;font-weight:800;letter-spacing:.3px}
</style><marker id="ar" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" class="a"/></marker></defs>
<rect width="420" height="297" class="bg"/>

<!-- Header -->
<text x="18" y="27" class="t title">FAILURE &amp; EFFECTS</text>
<a href="https://github.com/xakepp35/go_backend_combat"><text x="402" y="27" text-anchor="end" class="m sub">github.com/xakepp35/go_backend_combat</text></a>
<text x="18" y="36" class="m sub">Повтор, timeout и partial failure требуют явной семантики эффекта и управляемого recovery.</text>
<line x1="18" y1="44" x2="402" y2="44" class="r"/>

<!-- Flow: 1 → 2 → 3 ↘ 4 → 5 → 6 -->
<path d="M134 106H152M268 106H286M344 162V168H76V174M134 229H152M268 229H286" class="as" stroke-width="1.9" marker-end="url(#ar)"/>

<!-- 1 IDEMPOTENCY -->
<g><rect x="18" y="51" width="116" height="111" rx="2" class="card"/>
<text x="26" y="66" class="a num">01.</text><text x="39" y="66" class="t ct">IDEMPOTENCY</text>
<line x1="26" y1="73" x2="126" y2="73" class="r"/>
<text x="26" y="88" class="m q">Что произойдёт, если одну операцию повторить?</text>
<text x="26" y="101" class="a tag">INPUT</text>
<text x="26" y="112" class="m f">job.created × 2</text>
<text x="26" y="126" class="a tag">EFFECT</text>
<text x="26" y="137" class="m e">Повтор не должен создавать новый</text>
<text x="26" y="144" class="m e">нежелательный эффект.</text>
<text x="26" y="158" class="a tag">KEY</text>
<text x="57" y="158" class="m f">event_id / operation_id</text></g>

<!-- 2 RETRY -->
<g><rect x="152" y="51" width="116" height="111" rx="2" class="card"/>
<text x="160" y="66" class="a num">02.</text><text x="173" y="66" class="t ct">RETRY</text>
<line x1="160" y1="73" x2="260" y2="73" class="r"/>
<text x="160" y="88" class="m q">Что можно повторить после ошибки?</text>
<text x="160" y="101" class="a tag">POLICY</text>
<text x="160" y="112" class="m f">attempt 1 → timeout</text>
<text x="160" y="120" class="m f">attempt 2 → success</text>
<text x="160" y="134" class="m e">Retry допустим только для ошибок,</text>
<text x="160" y="141" class="m e">для которых повтор имеет безопасную семантику.</text>
<text x="160" y="155" class="a tag">НЕ RETRY EVERYTHING</text></g>

<!-- 3 BACKOFF -->
<g><rect x="286" y="51" width="116" height="111" rx="2" class="card"/>
<text x="294" y="66" class="a num">03.</text><text x="307" y="66" class="t ct">BACKOFF</text>
<line x1="294" y1="73" x2="394" y2="73" class="r"/>
<text x="294" y="88" class="m q">Как повторить так, чтобы не усилить отказ?</text>
<text x="294" y="101" class="a tag">EXPONENTIAL</text>
<text x="294" y="112" class="m f">100ms → 200ms → 400ms → 800ms</text>
<text x="294" y="126" class="a tag">JITTER</text>
<text x="294" y="137" class="m f">800ms ± random delay</text>
<text x="294" y="151" class="m e">Backoff снижает повторную нагрузку;</text>
<text x="294" y="158" class="m e">jitter разносит повторные попытки во времени.</text></g>

<!-- 4 IDEMPOTENT STATE -->
<g><rect x="18" y="174" width="116" height="111" rx="2" class="card"/>
<text x="26" y="189" class="a num">04.</text><text x="39" y="189" class="t ct">STATE TRANSITION</text>
<line x1="26" y1="196" x2="126" y2="196" class="r"/>
<text x="26" y="211" class="m q">Может ли повтор безопасно изменить state?</text>
<text x="26" y="224" class="a tag">JOB</text>
<text x="26" y="235" class="m f">pending → running</text>
<text x="26" y="246" class="m f">running → running</text>
<text x="26" y="260" class="m e">State transition должна иметь явную</text>
<text x="26" y="267" class="m e">семантику повторного вызова.</text>
<text x="26" y="280" class="a tag">SQL</text>
<text x="26" y="289" class="m f">WHERE status = 'pending'</text></g>

<!-- 5 OUTBOX -->
<g><rect x="152" y="174" width="116" height="111" rx="2" class="card"/>
<text x="160" y="189" class="a num">05.</text><text x="173" y="189" class="t ct">OUTBOX</text>
<line x1="160" y1="196" x2="260" y2="196" class="r"/>
<text x="160" y="211" class="m q">Как не потерять event между DB и broker?</text>
<text x="160" y="224" class="a tag">ATOMIC LOCAL CHANGE</text>
<text x="160" y="235" class="m f">DB state + outbox row</text>
<text x="160" y="245" class="m f">        ↓</text>
<text x="160" y="253" class="m f">     relay</text>
<text x="160" y="261" class="m f">        ↓</text>
<text x="160" y="269" class="m f">      Kafka</text>
<text x="160" y="282" class="m e">Состояние и намерение отправить event</text>
<text x="160" y="289" class="m e">фиксируются одной локальной transaction.</text></g>

<!-- 6 FAILURE POLICY -->
<g><rect x="286" y="174" width="116" height="111" rx="2" class="card"/>
<text x="294" y="189" class="a num">06.</text><text x="307" y="189" class="t ct">FAILURE POLICY</text>
<line x1="294" y1="196" x2="394" y2="196" class="r"/>
<text x="294" y="211" class="m q">Что делать после распределённого failure?</text>
<text x="294" y="224" class="a tag">TIMEOUT</text>
<text x="345" y="224" class="m e">result unknown</text>
<text x="294" y="234" class="a tag">CRASH</text>
<text x="345" y="234" class="m e">redelivery possible</text>
<text x="294" y="244" class="a tag">DUPLICATE</text>
<text x="345" y="244" class="m e">idempotency</text>
<text x="294" y="254" class="a tag">REORDER</text>
<text x="345" y="254" class="m e">ordering policy</text>
<text x="294" y="264" class="a tag">DOWNSTREAM FAIL</text>
<text x="345" y="264" class="m e">retry / reject</text>
<text x="294" y="278" class="a tag">RULE</text>
<text x="294" y="287" class="t e">Distributed correctness =</text>
<text x="294" y="294" class="t e">known failure semantics + bounded recovery.</text></g>
</svg>