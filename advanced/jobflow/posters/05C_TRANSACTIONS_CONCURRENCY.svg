<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
<title>05C. TRANSACTIONS &amp; CONCURRENCY</title>
<desc>PostgreSQL: transaction boundary, MVCC, isolation, lost update, locking and retry.</desc>
<defs><style>
.bg{fill:#0B0D10}.card{fill:#11171D;stroke:#3E4853;stroke-width:.8}.inner{fill:#151B21;stroke:#46515C;stroke-width:.7}.t{fill:#F3F6F8;font-family:Inter,"Segoe UI",Arial,sans-serif}.m{fill:#A2ABB5;font-family:Inter,"Segoe UI",Arial,sans-serif}.a{fill:#7DD3FC}.as{stroke:#7DD3FC;fill:none;stroke-linecap:round;stroke-linejoin:round}.r{stroke:#2A3037;stroke-width:.7}
.title{font-size:17px;font-weight:700;letter-spacing:1.3px}.sub{font-size:4.7px;font-weight:500}.num{font-size:7px;font-weight:800}.ct{font-size:5.8px;font-weight:700;letter-spacing:.48px}.q{font-size:4.05px;font-weight:500}.e{font-size:3.65px;font-weight:500}.f{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:3.35px;font-weight:600}.tag{font-size:3px;font-weight:700;letter-spacing:.45px}.big{font-size:7.8px;font-weight:800}.hero{font-size:6.4px;font-weight:800;letter-spacing:.4px}
</style><marker id="ar" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" class="a"/></marker></defs>
<rect width="420" height="297" class="bg"/>

<!-- Header -->
<text x="18" y="27" class="t title">TRANSACTIONS &amp; CONCURRENCY</text>
<a href="https://github.com/xakepp35/go_backend_combat"><text x="402" y="27" text-anchor="end" class="m sub">github.com/xakepp35/go_backend_combat</text></a>
<text x="18" y="36" class="m sub">Сохраняй инварианты при параллельных изменениях: transaction → isolation → conflict → commit.</text>
<line x1="18" y1="44" x2="402" y2="44" class="r"/>

<!-- Flow: 1 → 2 → 3 ↘ 4 → 5 → 6 -->
<path d="M134 106H152" class="as" stroke-width="1.9" marker-end="url(#ar)"/>
<path d="M268 106H286" class="as" stroke-width="1.9" marker-end="url(#ar)"/>
<path d="M344 162V168H76V174" class="as" stroke-width="1.9" marker-end="url(#ar)"/>
<path d="M134 229H152" class="as" stroke-width="1.9" marker-end="url(#ar)"/>
<path d="M268 229H286" class="as" stroke-width="1.9" marker-end="url(#ar)"/>

<!-- 1 TRANSACTION -->
<g><rect x="18" y="51" width="116" height="111" rx="2" class="card"/>
<text x="26" y="66" class="a num">01.</text><text x="39" y="66" class="t ct">TRANSACTION</text>
<line x1="26" y1="73" x2="126" y2="73" class="r"/>
<text x="26" y="88" class="m q">Какая группа изменений должна быть одной операцией?</text>
<text x="26" y="101" class="a tag">BOUNDARY</text>
<text x="26" y="112" class="m f">BEGIN;</text>
<text x="26" y="120" class="m f">UPDATE jobs SET status = 'running'</text>
<text x="26" y="128" class="m f">WHERE id = $1;</text>
<text x="26" y="136" class="m f">COMMIT;</text>
<text x="26" y="150" class="a tag">FAILURE</text>
<text x="26" y="160" class="m e">Ошибка → ROLLBACK, состояние не должно</text>
<text x="26" y="166" class="m e">оказаться частично изменённым.</text></g>

<!-- 2 MVCC -->
<g><rect x="152" y="51" width="116" height="111" rx="2" class="card"/>
<text x="160" y="66" class="a num">02.</text><text x="173" y="66" class="t ct">MVCC</text>
<line x1="160" y1="73" x2="260" y2="73" class="r"/>
<text x="160" y="88" class="m q">Как параллельные транзакции видят данные?</text>
<text x="160" y="101" class="a tag">SNAPSHOT</text>
<rect x="160" y="109" width="43" height="28" rx="1.5" class="inner"/>
<text x="181" y="121" text-anchor="middle" class="t e">OLD</text>
<text x="181" y="130" text-anchor="middle" class="m e">version</text>
<rect x="211" y="109" width="43" height="28" rx="1.5" class="inner"/>
<text x="232" y="121" text-anchor="middle" class="t e">NEW</text>
<text x="232" y="130" text-anchor="middle" class="m e">version</text>
<text x="160" y="148" class="m e">Транзакция работает со своим представлением</text>
<text x="160" y="155" class="m e">видимых версий данных.</text></g>

<!-- 3 ISOLATION -->
<g><rect x="286" y="51" width="116" height="111" rx="2" class="card"/>
<text x="294" y="66" class="a num">03.</text><text x="307" y="66" class="t ct">ISOLATION</text>
<line x1="294" y1="73" x2="394" y2="73" class="r"/>
<text x="294" y="88" class="m q">Какие конкурентные наблюдения допустимы?</text>
<text x="294" y="101" class="a tag">POSTGRESQL</text>
<text x="294" y="112" class="t e">READ COMMITTED</text>
<text x="294" y="120" class="m e">snapshot на statement</text>
<text x="294" y="132" class="t e">REPEATABLE READ</text>
<text x="294" y="140" class="m e">стабильный snapshot transaction</text>
<text x="294" y="152" class="t e">SERIALIZABLE</text>
<text x="294" y="160" class="m e">эффект как при последовательном выполнении</text></g>

<!-- 4 LOST UPDATE -->
<g><rect x="18" y="174" width="116" height="111" rx="2" class="card"/>
<text x="26" y="189" class="a num">04.</text><text x="39" y="189" class="t ct">LOST UPDATE</text>
<line x1="26" y1="196" x2="126" y2="196" class="r"/>
<text x="26" y="211" class="m q">Что случится при read → change → write?</text>
<text x="26" y="224" class="a tag">ДВА WORKER</text>
<text x="26" y="235" class="m f">A: read attempt = 3</text>
<text x="26" y="243" class="m f">B: read attempt = 3</text>
<text x="26" y="251" class="m f">A: write attempt = 4</text>
<text x="26" y="259" class="m f">B: write attempt = 4</text>
<text x="26" y="273" class="a tag">ПРОБЛЕМА</text>
<text x="26" y="282" class="m e">Ожидали 5, получили 4.</text></g>

<!-- 5 LOCK -->
<g><rect x="152" y="174" width="116" height="111" rx="2" class="card"/>
<text x="160" y="189" class="a num">05.</text><text x="173" y="189" class="t ct">LOCK</text>
<line x1="160" y1="196" x2="260" y2="196" class="r"/>
<text x="160" y="211" class="m q">Как защитить конкретную точку конфликта?</text>
<text x="160" y="224" class="a tag">ROW LOCK</text>
<text x="160" y="235" class="m f">SELECT ...</text>
<text x="160" y="242" class="m f">FOR UPDATE;</text>
<text x="160" y="256" class="m e">A захватывает строку → меняет → commit.</text>
<text x="160" y="264" class="m e">B ждёт и продолжает после освобождения.</text>
<text x="160" y="277" class="a tag">PRINCIPLE</text>
<text x="160" y="285" class="m e">Lock защищает конкретный конфликт,</text>
<text x="160" y="291" class="m e">а не заменяет выбор isolation level.</text></g>

<!-- 6 RETRY / ACID -->
<g><rect x="286" y="174" width="116" height="111" rx="2" class="card"/>
<text x="294" y="189" class="a num">06.</text><text x="307" y="189" class="t ct">COMMIT / RETRY</text>
<line x1="294" y1="196" x2="394" y2="196" class="r"/>
<text x="294" y="211" class="m q">Что делать, если concurrent commit конфликтует?</text>
<text x="294" y="224" class="a tag">SERIALIZATION</text>
<text x="294" y="235" class="m f">conflict → rollback / failure</text>
<text x="294" y="243" class="m f">→ retry transaction</text>
<text x="294" y="256" class="a tag">ACID</text>
<text x="294" y="266" class="t e">A → atomicity</text>
<text x="294" y="274" class="t e">C → invariants</text>
<text x="294" y="282" class="t e">I → isolation</text>
<text x="350" y="266" class="t e">D → durability</text>
<text x="294" y="291" class="m e">Успех — только после корректного commit.</text></g>
</svg>