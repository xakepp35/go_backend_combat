<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
<title>01. GO ENGINEERING MINDSET</title>
<desc>Универсальный цикл инженерного решения на примере Go (10 минут)</desc>
<defs><style>
.bg{fill:#0B0D10}.card{fill:#11171D;stroke:#3E4853;stroke-width:.8}.t{fill:#F3F6F8;font-family:Inter,"Segoe UI",Arial,sans-serif}.m{fill:#A2ABB5;font-family:Inter,"Segoe UI",Arial,sans-serif}.a{fill:#7DD3FC}.as{stroke:#7DD3FC;fill:none;stroke-linecap:round;stroke-linejoin:round}.r{stroke:#2A3037;stroke-width:.7}
.title{font-size:17px;font-weight:700;letter-spacing:1.3px}.sub{font-size:4.8px;font-weight:500}.num{font-size:7px;font-weight:800}.ct{font-size:6px;font-weight:700;letter-spacing:.55px}.q{font-size:4.5px;font-weight:500}.el{font-size:3.3px;font-weight:700;letter-spacing:.7px}.e{font-size:4.05px;font-weight:500}.f{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:3.9px;font-weight:600}.tag{font-size:3.3px;font-weight:700;letter-spacing:.55px}
</style><marker id="ar" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" class="a"/></marker></defs>
<rect width="420" height="297" class="bg"/>

<!-- Header -->
<text x="18" y="27" class="t title">01. GO ENGINEERING MINDSET</text>
<a href="https://github.com/xakepp35/go_backend_combat"><text x="402" y="27" text-anchor="end" class="t sub">github.com/xakepp35/go_backend_combat</text></a>
<text x="18" y="36" class="m sub">Как принимать инженерное решение · Минимальная конструкция, достаточная для гарантии.</text>
<line x1="18" y1="44" x2="402" y2="44" class="r"/>

<!-- Flow: 1 → 2 → 3 ↘ 4 → 5 → 6 -->
<path d="M134 106H152" class="as" stroke-width="1.9" marker-end="url(#ar)"/>
<path d="M268 106H286" class="as" stroke-width="1.9" marker-end="url(#ar)"/>
<path d="M344 162V168H76V174" class="as" stroke-width="1.9" marker-end="url(#ar)"/>
<path d="M134 229H152" class="as" stroke-width="1.9" marker-end="url(#ar)"/>
<path d="M268 229H286" class="as" stroke-width="1.9" marker-end="url(#ar)"/>

<!-- 1 -->
<g><rect x="18" y="51" width="116" height="111" rx="2" class="card"/>
<text x="26" y="66" class="a num">01.</text><text x="39" y="66" class="t ct">REQUIREMENT</text>
<line x1="26" y1="73" x2="126" y2="73" class="r"/>
<text x="26" y="88" class="m q">Что система должна делать?</text>
<text x="26" y="101" class="a ct">GO</text>
<text x="26" y="111" class="t e">Писать серверные программы,</text>
<text x="26" y="118" class="t e">которые легко собирать, запускать,</text>
<text x="26" y="125" class="t e">тестировать и сопровождать.</text>
<text x="26" y="141" class="a ct">КРИТЕРИИ ТРЕБОВАНИЯ</text>
<text x="26" y="150" class="m e">Функциональность + производительность</text>
<text x="26" y="157" class="m e">+ надёжность + сопровождаемость.</text></g>

<!-- 2 -->
<g><rect x="152" y="51" width="116" height="111" rx="2" class="card"/>
<text x="160" y="66" class="a num">02.</text><text x="173" y="66" class="t ct">INVARIANT</text>
<line x1="160" y1="73" x2="260" y2="73" class="r"/>
<text x="160" y="88" class="m q">Что всегда должно оставаться истинным?</text>
<text x="160" y="101" class="a ct">GO</text>
<text x="160" y="111" class="t e">Поток управления, зависимости</text>
<text x="160" y="118" class="t e">и ошибки должны быть явными</text>
<text x="160" y="125" class="t e">и предсказуемыми.</text>
<text x="160" y="141" class="a ct">ИНВАРИАНТ</text>
<text x="160" y="150" class="m e">Изменение состояния должно иметь</text>
<text x="160" y="157" class="m e">понятную причину и владельца.</text></g>

<!-- 3 -->
<g><rect x="286" y="51" width="116" height="111" rx="2" class="card"/>
<text x="294" y="66" class="a num">03.</text><text x="307" y="66" class="t ct">BOUNDARY</text>
<line x1="294" y1="73" x2="394" y2="73" class="r"/>
<text x="294" y="88" class="m q">Где проходит граница ответственности?</text>
<text x="294" y="101" class="a ct">GO</text>
<text x="294" y="111" class="t e">Типы, функции, пакеты и интерфейсы</text>
<text x="294" y="118" class="t e">локализуют ответственность</text>
<text x="294" y="125" class="t e">и стоимость изменений.</text>
<text x="294" y="141" class="a ct">ГРАНИЦА = КОНТРАКТ</text>
<text x="294" y="150" class="m e">Потребитель знает нужное поведение,</text>
<text x="294" y="157" class="m e">но не обязан знать реализацию.</text></g>

<!-- 4 -->
<g>
<rect x="18" y="174" width="116" height="111" rx="2" class="card"/>
<text x="26" y="189" class="a num">04.</text><text x="39" y="189" class="t ct">MECHANISM</text>
<line x1="26" y1="196" x2="126" y2="196" class="r"/>
<text x="26" y="211" class="m q">Какой минимальный механизм это обеспечивает?</text>
<text x="26" y="224" class="a ct">GO</text>
<text x="26" y="234" class="t e">struct → данные</text>
<text x="26" y="241" class="t e">interface → контракт</text>
<text x="26" y="248" class="t e">error → failure</text>
<text x="68" y="234" class="t e">goroutine → concurrent work</text>
<text x="68" y="241" class="t e">channel → coordination</text>
<text x="68" y="248" class="t e">context → cancellation / deadline</text>
<text x="26" y="265" class="a ct">ПРИНЦИП</text>
<text x="26" y="274" class="m e">Выбирай механизм по гарантии,</text>
<text x="26" y="280" class="m e">которую он должен обеспечить.</text>
</g>

<!-- 5 -->
<g><rect x="152" y="174" width="116" height="111" rx="2" class="card"/>
<text x="160" y="189" class="a num">05.</text><text x="173" y="189" class="t ct">EVIDENCE</text>
<line x1="160" y1="196" x2="260" y2="196" class="r"/>
<text x="160" y="211" class="m q">Как мы докажем правильность?</text>
<text x="160" y="224" class="a ct">GO</text>
<text x="160" y="234" class="t e">go test -race benchmark</text>
<text x="160" y="244" class="m e">Тестируем поведение, concurrency</text>
<text x="160" y="251" class="m e">и производительность.</text>
<text x="160" y="264" class="a ct">ДОКАЗАТЕЛЬСТВО</text>
<text x="160" y="273" class="m e">Код сам по себе не является доказательством.</text>
<text x="160" y="280" class="m e">Нужен воспроизводимый сигнал.</text></g>

<!-- 6 -->
<g><rect x="286" y="174" width="116" height="111" rx="2" class="card"/>
<text x="294" y="189" class="a num">06.</text><text x="307" y="189" class="t ct">VERIFY</text>
<line x1="294" y1="196" x2="394" y2="196" class="r"/>
<text x="294" y="211" class="m q">Что должно быть доказано?</text>
<text x="294" y="224" class="a ct">GO</text>
<text x="294" y="234" class="t e">Контракт выполнен.</text>
<text x="294" y="241" class="t e">Инварианты сохранены.</text>
<text x="294" y="248" class="t e">Ошибки и отказ bounded.</text>
<text x="294" y="261" class="a ct">PASS / FAIL</text>
<text x="294" y="270" class="m e">✅ Поведение         ✅ Инварианты</text>
<text x="294" y="277" class="m e">✅ Отказ      ✅ Ресурсы    ✅ Эффект</text></g>
</svg>