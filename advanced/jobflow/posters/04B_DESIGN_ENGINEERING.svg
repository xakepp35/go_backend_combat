<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
<title>04B. DESIGN ENGINEERING</title>
<desc>Практическая модель проектирования: ответственность, зависимости, сложность и стоимость изменения.</desc>
<defs><style>
.bg{fill:#0B0D10}.card{fill:#11171D;stroke:#3E4853;stroke-width:.8}.t{fill:#F3F6F8;font-family:Inter,"Segoe UI",Arial,sans-serif}.m{fill:#A2ABB5;font-family:Inter,"Segoe UI",Arial,sans-serif}.a{fill:#7DD3FC}.as{stroke:#7DD3FC;fill:none;stroke-linecap:round;stroke-linejoin:round}.r{stroke:#2A3037;stroke-width:.7}
.title{font-size:17px;font-weight:700;letter-spacing:1.3px}.sub{font-size:4.75px;font-weight:500}.num{font-size:7px;font-weight:800}.ct{font-size:5.8px;font-weight:700;letter-spacing:.48px}.q{font-size:4.05px;font-weight:500}.e{font-size:3.7px;font-weight:500}.f{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:3.4px;font-weight:600}.tag{font-size:3px;font-weight:700;letter-spacing:.45px}.hero{font-size:6.8px;font-weight:800;letter-spacing:.4px}
</style><marker id="ar" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" class="a"/></marker></defs>
<rect width="420" height="297" class="bg"/>

<!-- Header -->
<text x="18" y="27" class="t title">DESIGN ENGINEERING</text>
<a href="https://github.com/xakepp35/go_backend_combat"><text x="402" y="27" text-anchor="end" class="m sub">github.com/xakepp35/go_backend_combat</text></a>
<text x="18" y="36" class="m sub">Проектируй границы по изменениям: локализуй ответственность, направляй зависимости, оправдывай сложность.</text>
<line x1="18" y1="44" x2="402" y2="44" class="r"/>

<!-- Flow: 1 → 2 → 3 ↘ 4 → 5 → 6 -->
<path d="M134 106H152M268 106H286M344 162V168H76V174M134 229H152M268 229H286" class="as" stroke-width="1.9" marker-end="url(#ar)"/>

<!-- 1 RESPONSIBILITY -->
<g><rect x="18" y="51" width="116" height="111" rx="2" class="card"/>
<text x="26" y="66" class="a num">01.</text><text x="39" y="66" class="t ct">RESPONSIBILITY</text>
<line x1="26" y1="73" x2="126" y2="73" class="r"/>
<text x="26" y="88" class="m q">Что должно изменяться вместе?</text>
<text x="26" y="101" class="a tag">BOUNDARY</text>
<text x="26" y="112" class="m e">Связанное поведение держи вместе.</text>
<text x="26" y="119" class="m e">Разные причины изменения — разные границы.</text>
<text x="26" y="133" class="a tag">ВОПРОС</text>
<text x="26" y="144" class="m e">Что заставит этот модуль измениться?</text>
<text x="26" y="153" class="m e">Если причины независимы — граница широка.</text></g>

<!-- 2 DEPENDENCY -->
<g><rect x="152" y="51" width="116" height="111" rx="2" class="card"/>
<text x="160" y="66" class="a num">02.</text><text x="173" y="66" class="t ct">DEPENDENCY</text>
<line x1="160" y1="73" x2="260" y2="73" class="r"/>
<text x="160" y="88" class="m q">От чего должна зависеть политика?</text>
<text x="160" y="101" class="a tag">ПРАВИЛО</text>
<text x="160" y="112" class="m e">Стабильная политика не знает детали.</text>
<text x="160" y="119" class="m e">Зависимость направлена к контракту.</text>
<text x="160" y="133" class="a tag">ПРИМЕР</text>
<text x="160" y="144" class="m f">Service</text>
<text x="160" y="151" class="m f">JobRepository</text>
<text x="160" y="158" class="m f">PostgreSQL</text></g>

<!-- 3 COMPLEXITY -->
<g><rect x="286" y="51" width="116" height="111" rx="2" class="card"/>
<text x="294" y="66" class="a num">03.</text><text x="307" y="66" class="t ct">COMPLEXITY</text>
<line x1="294" y1="73" x2="394" y2="73" class="r"/>
<text x="294" y="88" class="m q">Зачем здесь вообще нужна конструкция?</text>
<text x="294" y="101" class="a tag">KISS</text>
<text x="294" y="112" class="m e">Минимальная конструкция, достаточная</text>
<text x="294" y="119" class="m e">для требования.</text>
<text x="294" y="133" class="a tag">YAGNI</text>
<text x="294" y="144" class="m e">Не создавай возможность до появления</text>
<text x="294" y="151" class="m e">реального требования.</text>
<text x="294" y="161" class="a tag">ВОПРОС</text><text x="343" y="161" class="m e">Можно проще?</text></g>

<!-- 4 COHESION / COUPLING -->
<g><rect x="18" y="174" width="116" height="111" rx="2" class="card"/>
<text x="26" y="189" class="a num">04.</text><text x="39" y="189" class="t ct">COHESION / COUPLING</text>
<line x1="26" y1="196" x2="126" y2="196" class="r"/>
<text x="26" y="211" class="m q">Как связаны части внутри и снаружи?</text>
<text x="26" y="224" class="a tag">COHESION ↑</text>
<text x="26" y="235" class="m e">Связанное поведение находится вместе.</text>
<text x="26" y="249" class="a tag">COUPLING ↓</text>
<text x="26" y="260" class="m e">Изменение одной части минимально</text>
<text x="26" y="267" class="m e">затрагивает остальные.</text>
<text x="26" y="280" class="a tag">ЦЕЛЬ</text>
<text x="59" y="280" class="m e">strong inside, loose outside.</text></g>

<!-- 5 CHANGE -->
<g><rect x="152" y="174" width="116" height="111" rx="2" class="card"/>
<text x="160" y="189" class="a num">05.</text><text x="173" y="189" class="t ct">CHANGE</text>
<line x1="160" y1="196" x2="260" y2="196" class="r"/>
<text x="160" y="211" class="m q">Как изменение пройдёт через систему?</text>
<text x="160" y="224" class="a tag">СПРОСИ</text>
<text x="160" y="235" class="m e">Что изменится?</text>
<text x="160" y="243" class="m e">Какие части будут затронуты?</text>
<text x="160" y="251" class="m e">Сколько знаний придётся синхронизировать?</text>
<text x="160" y="265" class="a tag">DRY</text>
<text x="160" y="276" class="m e">Одно знание — один источник истины.</text></g>

<!-- 6 CHANGE COST -->
<g><rect x="286" y="174" width="116" height="111" rx="2" class="card"/>
<text x="294" y="189" class="a num">06.</text><text x="307" y="189" class="t ct">CHANGE COST</text>
<line x1="294" y1="196" x2="394" y2="196" class="r"/>
<text x="294" y="211" class="m q">Насколько дорого изменить систему?</text>
<text x="294" y="224" class="a tag">MODEL</text>
<text x="294" y="235" class="m f">Responsibility</text>
<text x="294" y="243" class="m f">+ Dependency</text>
<text x="294" y="251" class="m f">+ Complexity</text>
<text x="294" y="259" class="m f">= Change Cost</text>
<text x="294" y="273" class="a tag">GOOD DESIGN</text>
<text x="294" y="282" class="m e">Изменение локально, зависимость ясна,</text>
<text x="294" y="288" class="m e">сложность оправдана.</text></g>
</svg>