result: |
  Управление задачами переведено на ZTS по прямому поручению владельца от 2026-11-10.
  Два общих скрипта/скилла zplan/zdone установлены из ingress-research/tools/zts.
  Устойчивые правила находятся в AGENTS.md, очереди/незавершённый progress и результаты — только в .zts.
  Прежние checkpoint/changelog/continuation workflows отменены. Упоминания их в перенесённом ниже историческом контексте не являются действующими инструкциями.
  Продуктовая реализация, инфраструктура, модели, внешние контакты и физические проверки во время миграции не запускались. Очередь не даёт новых разрешений на них.

  Убраны старые task-state файлы/инструменты: pkg/jog/.project/CHECKPOINT.md, go-routine-bot/.project/CHECKPOINT.md.

  Перенесённый исторический фактический контекст (не новые runs/проверки, старые workflow-команды недействительны):
  go_backend_combat/pkg/jog/.project/CHECKPOINT.md:
    context: '# jog checkpoint


      Completed: typed bounded worker pool, futures, context/middleware/timeouts,

      sealed heterogeneous DAGs, event-driven scheduler, retries outside workers,

      execution metadata, typed codecs and leased journal histories. Local file WAL:

      CRC32C headers/payloads, fsync, Unix flock, incomplete-tail recovery, poisoned

      writer on ambiguous I/O. Unfinished attempts are at least once; effects need

      idempotency. README records recovery limits and executable examples.


      Follow-up completed: compared all five requested libraries, improved jog,

      published results in README, removed temporary dependency modules.

      Pinned versions: ants/v2 v2.12.1, pond/v2 v2.7.3, conc v0.3.0,

      workerpool v1.3.0, bytedance/gopkg v0.1.4 util/gopool.


      Harness: benchmarks/compare_test.go.tmpl, compare.sh, summarize.py; only stdlib

      in the real module. Reproducer creates/deletes its own temporary module.

      Raw results, checksums, source hashes, median/min/max JSON and reversible patches

      at benchmarks/results/2026-11-07/. Before and after: 252 samples each, six

      workloads x six pools x seven rounds. 8 workers/8 parallel senders, GOMAXPROCS=8,

      GOGC=100, 300ms, rotated/reversed library ordering. Native jog/pond futures,

      shared adapter for closure-only APIs. Adapter guards also optimized for the

      final run; jog''s harness path stayed identical. All results verified.


      Production optimization: one pool-cancellation subscription per worker, rather

      than per task; Err guards before Cause queries on healthy contexts. Per-worker

      slot mutex protects active cancellation. Request cause/deadline/values retained.

      No-op memory 440B/8 -> 288B/5 allocations. Median reductions vs original:

      serial 24.1%, parallel noop 14.3%, cancelable 10.5%, SHA256 12.4%, burst 37.9%.

      Timer case +4.9%, overlapping ranges; do not claim all workloads improved.


      Library caveats: workerpool has unbounded backlog; conc re-panics at Wait;

      gopool has a soft capacity and no shutdown. Benchmarks compare execution only,

      not DAG/WAL, full lifecycle equivalence or p99 latency. No universal winner.


      Final checks: go test -race ./... -count=10 and go vet ./... pass. Adapter tests

      pass under race. Crash recovery uses a real subprocess exit. Source hashes,

      reverse patches and README tables validated. Dependency graph contains only

      jog plus stdlib; go.mod has no requires and there is no go.sum. Benchmark

      processes and temporary modules are gone. Download cache retained normally.


      Completed follow-up: review task 1 only, from reviews/practice/taskgraph/next.md.

      Implemented RunOptions.ErrorPolicy with zero-value ContinueIndependent and explicit

      FailFast. Coordinator separates terminal node failures from global stop; failed

      descendants are settled iteratively (shared descendants counted once), independent

      ready/active/retrying branches continue. Terminal NodeErrors aggregate in graph

      definition order. Journal/codec/retry callback/admission failures and original Run

      context cancellation globally cancel and join. Accepted successes still commit

      when the journal is healthy. WAL format unchanged; policy is per invocation;

      partial RunFailed remains resumable, successful branches never rerun.


      Own synctest checks cover active/ready branches at 2/8/32 workers, all-blocked

      termination, shared joins, deterministic error order, retry-only waiting, local

      timeouts, external cancellation and joining, before/after-commit journal failures,

      durable resume and policy switching. Added tests for node failure kinds and shared

      pool isolation under both policies. Baseline reproduced mentor failure at 2/8/32;

      after core change normal go test ./... passed including mentor checks. Final

      go test -race ./... -count=10 -timeout=90s and go vet ./... passed. README,

      stable invariants and task-1 worksheet updated, including Codex authorship/help.

      Task 2 (outcome API) and task 3 (relocatable submission) remain out of scope.

      Mentor code unchanged;

      use go test ./... directly in current layout, not the old-layout mentor runner.

      Prior pool benchmark records are historical; graph/WAL benchmarks were not run.


      No commits. User .gitignore change preserved.

      Workstation off-limits disk and legacy filesystem untouched. Never edit a running

      benchmark shell script; a discarded intermediate run was rerun cleanly after

      such an edit. Final script exited zero with seven validated rounds.

      '
  go_backend_combat/go-routine-bot/.project/CHECKPOINT.md:
    context: '# go-routine-bot checkpoint


      ## Current objective and decisions


      Documentation package for go-routine-bot: README, VISION, MVP_SPEC, PILOT, PLAN, ROADMAP and AGENTS,
      with this checkpoint. Application implementation remains future work. No personal names or named invitation
      files belong in the repository. Invitations may be prepared privately. Do not recreate the removed
      message draft.


      Pilot: one mentor and initial participants; 2–3 additional learners may join. Composition remains
      tentative. Three goal-based routes: start in backend / transition to Go / systems design. The bot
      may be a participant''s main Go learning project. Two 45–60 minute sessions plus a review are proposed,
      not confirmed availability.


      One Go app, PostgreSQL/pgxpool v5, embedded Goose v3 and Compose; public object contracts in pkg.
      Human acceptance, source-grounded AI hints. Course references use actual large chapters and stable
      IDs rather than assuming a course/lessons.json file exists.


      ## Latest change


      Added PLAN.md: service-contract-first implementation sequence aligned with mentor/0x_PROJECT_FLOW.md,
      stages 0–8, mentor/participant responsibilities, first three work sessions, schema assessment, transaction
      guarantees and embedded migration policy. Synchronized README, MVP_SPEC, PILOT, ROADMAP and AGENTS.
      Schema review retained content versioning/FKs, replaced current-pointer-only progress with enrollment/assignment
      history, separated submission revisions from operation keys, and clarified rhythm, quota and notification
      guarantees. Route plan versions are frozen per enrollment; pause does not permit a second unfinished
      enrollment.


      Next implementation starts with one scenario and public GetDashboard/StartStep contracts, not full-schema
      SQL. No application or migration was created/applied, and no tests or external actions were performed.
      Personal invitation draft remains absent. Preserve the user''s existing .gitignore edit and unrelated
      course files.

      '
