tid: 0000000000018000
title: Переписать урок алгоритмов как живую обучающую беседу
body: 'По текущему запросу пользователя полностью переработать mentor/09_ALGORITHMS.md: простой разговорный
  язык, наглядные пошаговые примеры, постепенное введение терминов, вопросы с объяснениями для ментора.
  Сохранить 28 вопросов и маршруты 60–90 минут. README уже содержит ссылку; не включать его и прочие рабочие
  изменения в коммит.'
checks:
- 28 вопросов; ожидаемые ответы и подсказки; последовательное объяснение инварианта на примере; согласованные
  маршруты; проверка примеров и Markdown
progress: 'Полностью переписан mentor/09_ALGORITHMS.md: разговорный сценарий, 28 вопросов, маленькие пошаговые
  примеры, инвариант через записную книжку, сохранены маршруты. Идёт финальная проверка структуры, числовых
  примеров и оформления; затем локальная фиксация только урока и записи задачи.'
