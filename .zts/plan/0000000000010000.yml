title: Перевести управление проектом на ZTS
body: Миграция системы задач по общему поручению владельца. Сохранить предметный контекст, код и посторонний
  staging; убрать устаревшие task-state файлы и подключения. Новые продуктовые действия этой миграцией
  не разрешены.
checks:
- Две папки plan/done и счётчики head/tail, устойчивые правила без legacy workflows
