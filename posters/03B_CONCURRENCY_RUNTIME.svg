<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
<title>03B. GO CONCURRENCY RUNTIME</title>
<desc>Карта движения работы внутри Go runtime: go f() → G → RUNQ → scheduler → G+P+M → execute → wait → wake.</desc>
<defs><style>
.bg{fill:#0B0D10}.card{fill:#11171D;stroke:#3E4853;stroke-width:.8}.inner{fill:#151B21;stroke:#46515C;stroke-width:.7}.t{fill:#F3F6F8;font-family:Inter,"Segoe UI",Arial,sans-serif}.m{fill:#A2ABB5;font-family:Inter,"Segoe UI",Arial,sans-serif}.a{fill:#7DD3FC}.as{stroke:#7DD3FC;fill:none;stroke-linecap:round;stroke-linejoin:round}.r{stroke:#2A3037;stroke-width:.7}
.title{font-size:17px;font-weight:700;letter-spacing:1.3px}.sub{font-size:4.8px;font-weight:500}.num{font-size:7px;font-weight:800}.ct{font-size:5.9px;font-weight:700;letter-spacing:.5px}.q{font-size:4.15px;font-weight:500}.e{font-size:3.75px;font-weight:500}.f{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:3.5px;font-weight:600}.tag{font-size:3.05px;font-weight:700;letter-spacing:.5px}.hero{font-size:6.5px;font-weight:800;letter-spacing:.4px}.big{font-size:8.2px;font-weight:800;letter-spacing:.6px}
</style><marker id="ar" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" class="a"/></marker></defs>
<rect width="420" height="297" class="bg"/>

<!-- Header -->
<text x="18" y="27" class="t title">GO CONCURRENCY RUNTIME</text>
<a href="https://github.com/xakepp35/go_backend_combat"><text x="402" y="27" text-anchor="end" class="t sub">github.com/xakepp35/go_backend_combat</text></a>
<text x="18" y="36" class="m sub">go f() создаёт работу. Scheduler связывает G, P и M; runtime возвращает ожидающую работу обратно к выполнению.</text>
<line x1="18" y1="44" x2="402" y2="44" class="r"/>

<!-- Flow: 1 → 2 → 3 ↘ 4 → 5 → 6 -->
<path d="M134 106H152" class="as" stroke-width="1.9" marker-end="url(#ar)"/>
<path d="M268 106H286" class="as" stroke-width="1.9" marker-end="url(#ar)"/>
<path d="M344 162V168H76V174" class="as" stroke-width="1.9" marker-end="url(#ar)"/>
<path d="M134 229H152" class="as" stroke-width="1.9" marker-end="url(#ar)"/>
<path d="M268 229H286" class="as" stroke-width="1.9" marker-end="url(#ar)"/>

<!-- 1 CREATE -->
<g><rect x="18" y="51" width="116" height="111" rx="2" class="card"/>
<text x="26" y="66" class="a num">01.</text><text x="39" y="66" class="t ct">CREATE</text>
<line x1="26" y1="73" x2="126" y2="73" class="r"/>
<text x="26" y="88" class="m q">Что происходит после <tspan class="m f">go f()</tspan>?</text>
<text x="26" y="101" class="a ct">GO</text>
<text x="26" y="112" class="m f">go process(job)</text>
<text x="26" y="126" class="m e">Runtime создаёт goroutine G и делает</text>
<text x="26" y="132" class="m e">её готовой к выполнению.</text>
<text x="26" y="146" class="a tag">G</text>
<text x="40" y="146" class="m e">работа + stack + runtime state</text>
<text x="26" y="157" class="m e">G — не OS thread.</text></g>

<!-- 2 RUNNABLE -->
<g><rect x="152" y="51" width="116" height="111" rx="2" class="card"/>
<text x="160" y="66" class="a num">02.</text><text x="173" y="66" class="t ct">RUNNABLE</text>
<line x1="160" y1="73" x2="260" y2="73" class="r"/>
<text x="160" y="88" class="m q">Где ждёт готовая к выполнению G?</text>
<text x="160" y="101" class="a tag">RUN QUEUES</text>
<text x="160" y="112" class="m f">P0 [G][G][G]</text>
<text x="160" y="119" class="m f">P1 [G][G]</text>
<text x="160" y="126" class="m f">P2 [G][G][G][G]</text>
<text x="160" y="139" class="m f">GLOBAL [G][G][G][G]...</text>
<text x="160" y="151" class="m e">Scheduler использует локальную работу</text>
<text x="160" y="157" class="m e">и при дисбалансе перераспределяет её.</text></g>

<!-- 3 SCHEDULE -->
<g><rect x="286" y="51" width="116" height="111" rx="2" class="card"/>
<text x="294" y="66" class="a num">03.</text><text x="307" y="66" class="t ct">SCHEDULE</text>
<line x1="294" y1="73" x2="394" y2="73" class="r"/>
<text x="294" y="88" class="m q">Как runnable G получает CPU?</text>
<text x="294" y="101" class="a tag">SCHEDULER</text>
<rect x="294" y="108" width="22" height="20" rx="1.2" class="inner"/>
<text x="305" y="121" text-anchor="middle" class="t big">G</text>
<rect x="323" y="108" width="22" height="20" rx="1.2" class="inner"/>
<text x="334" y="121" text-anchor="middle" class="t big">P</text>
<rect x="352" y="108" width="22" height="20" rx="1.2" class="inner"/>
<text x="363" y="121" text-anchor="middle" class="t big">M</text>
<text x="294" y="139" class="m e">G — работа</text>
<text x="324" y="139" class="m e">P — ресурс для выполнения Go-кода</text>
<text x="294" y="148" class="m e">M — OS thread</text>
<text x="294" y="158" class="a tag">GOMAXPROCS → P</text></g>

<!-- 4 EXECUTE -->
<g><rect x="18" y="174" width="116" height="111" rx="2" class="card"/>
<text x="26" y="189" class="a num">04.</text><text x="39" y="189" class="t ct">EXECUTE</text>
<line x1="26" y1="196" x2="126" y2="196" class="r"/>
<text x="26" y="211" class="m q">Что может произойти во время выполнения?</text>
<text x="26" y="224" class="a tag">PATHS</text>
<text x="26" y="235" class="t e">COMPUTE → продолжать Go-код</text>
<text x="26" y="242" class="t e">PREEMPT → уступить выполнение</text>
<text x="26" y="249" class="t e">SYSCALL → ждать ОС</text>
<text x="26" y="256" class="t e">NETWORK → ждать I/O</text>
<text x="26" y="269" class="a tag">КЛЮЧ</text>
<text x="26" y="278" class="m e">Scheduler может дать CPU другой runnable G.</text></g>

<!-- 5 WAIT / IO -->
<g><rect x="152" y="174" width="116" height="111" rx="2" class="card"/>
<text x="160" y="189" class="a num">05.</text><text x="173" y="189" class="t ct">WAIT / I-O</text>
<line x1="160" y1="196" x2="260" y2="196" class="r"/>
<text x="160" y="211" class="m q">Что происходит, когда G не может продолжать?</text>
<text x="160" y="224" class="a tag">WAITING</text>
<text x="160" y="235" class="t e">SYSCALL → ждёт системную операцию</text>
<text x="160" y="242" class="t e">NETWORK → ждёт готовность через NETPOLL</text>
<text x="160" y="249" class="t e">TIMER → ждёт deadline / wakeup</text>
<text x="160" y="263" class="a tag">РЕСУРС</text>
<text x="160" y="272" class="m e">Ожидающая G не должна просто так</text>
<text x="160" y="279" class="m e">удерживать CPU.</text></g>

<!-- 6 WAKE -->
<g><rect x="286" y="174" width="116" height="111" rx="2" class="card"/>
<text x="294" y="189" class="a num">06.</text><text x="307" y="189" class="t ct">WAKE</text>
<line x1="294" y1="196" x2="394" y2="196" class="r"/>
<text x="294" y="211" class="m q">Что возвращает ожидающую G в работу?</text>
<text x="294" y="224" class="a tag">EVENT</text>
<text x="294" y="235" class="t e">I/O ready</text>
<text x="294" y="242" class="t e">timer fired</text>
<text x="294" y="249" class="t e">channel ready</text>
<text x="294" y="256" class="t e">другой сигнал runtime</text>
<text x="294" y="269" class="a tag">ЦИКЛ</text>
<text x="294" y="278" class="m f">EVENT → RUNNABLE → RUNQ</text>
<text x="294" y="284" class="m e">Дальше scheduler снова выбирает работу.</text></g>

<!-- Runtime control -->
<line x1="18" y1="290" x2="402" y2="290" class="r"/>
<text x="18" y="296" class="a tag">RUNTIME CONTROL</text>
<text x="98" y="296" class="m e">SYSMON · PREEMPTION · TIMERS · NETPOLL · GC</text>
<text x="402" y="296" text-anchor="end" class="m e">наблюдаем: trace · pprof</text>
</svg>