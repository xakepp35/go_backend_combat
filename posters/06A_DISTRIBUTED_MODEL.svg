<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
<title>06A. DISTRIBUTED MODEL</title>
<desc>Распределённая модель: граница процесса, latency, loss, duplicate, ordering и partial failure.</desc>
<defs><style>
.bg{fill:#0B0D10}.card{fill:#11171D;stroke:#3E4853;stroke-width:.8}.inner{fill:#151B21;stroke:#46515C;stroke-width:.7}.t{fill:#F3F6F8;font-family:Inter,"Segoe UI",Arial,sans-serif}.m{fill:#A2ABB5;font-family:Inter,"Segoe UI",Arial,sans-serif}.a{fill:#7DD3FC}.as{stroke:#7DD3FC;fill:none;stroke-linecap:round;stroke-linejoin:round}.r{stroke:#2A3037;stroke-width:.7}
.title{font-size:17px;font-weight:700;letter-spacing:1.25px}.sub{font-size:4.75px;font-weight:500}.num{font-size:7px;font-weight:800}.ct{font-size:5.75px;font-weight:700;letter-spacing:.45px}.q{font-size:4.05px;font-weight:500}.e{font-size:3.65px;font-weight:500}.f{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:3.4px;font-weight:600}.tag{font-size:3px;font-weight:700;letter-spacing:.45px}.big{font-size:7.7px;font-weight:800}.hero{font-size:6.3px;font-weight:800;letter-spacing:.3px}
</style><marker id="ar" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" class="a"/></marker></defs>
<rect width="420" height="297" class="bg"/>

<!-- Header -->
<text x="18" y="27" class="t title">DISTRIBUTED MODEL</text>
<a href="https://github.com/xakepp35/go_backend_combat"><text x="402" y="27" text-anchor="end" class="m sub">github.com/xakepp35/go_backend_combat</text></a>
<text x="18" y="36" class="m sub">Сеть превращает вызов в протокол: результат может задержаться, потеряться, повториться или остаться неизвестным.</text>
<line x1="18" y1="44" x2="402" y2="44" class="r"/>

<!-- Flow: 1 → 2 → 3 ↘ 4 → 5 → 6 -->
<path d="M134 106H152M268 106H286M344 162V168H76V174M134 229H152M268 229H286" class="as" stroke-width="1.9" marker-end="url(#ar)"/>

<!-- 1 BOUNDARY -->
<g><rect x="18" y="51" width="116" height="111" rx="2" class="card"/>
<text x="26" y="66" class="a num">01.</text><text x="39" y="66" class="t ct">BOUNDARY</text>
<line x1="26" y1="73" x2="126" y2="73" class="r"/>
<text x="26" y="88" class="m q">Что меняется, когда процесс отделяет сеть?</text>
<text x="26" y="101" class="a tag">LOCAL</text>
<text x="26" y="112" class="m f">call → result</text>
<text x="26" y="124" class="a tag">DISTRIBUTED</text>
<text x="26" y="135" class="m f">send → network → ???</text>
<text x="26" y="149" class="m e">Между процессами появляются задержка,</text>
<text x="26" y="156" class="m e">отказы и неопределённость результата.</text></g>

<!-- 2 LATENCY -->
<g><rect x="152" y="51" width="116" height="111" rx="2" class="card"/>
<text x="160" y="66" class="a num">02.</text><text x="173" y="66" class="t ct">LATENCY</text>
<line x1="160" y1="73" x2="260" y2="73" class="r"/>
<text x="160" y="88" class="m q">Что значит «ответ не пришёл вовремя»?</text>
<text x="160" y="101" class="a tag">TIMELINE</text>
<text x="160" y="113" class="m f">send ───────── response</text>
<text x="160" y="123" class="m f">           └─ timeout</text>
<text x="160" y="137" class="a tag">ВАЖНО</text>
<text x="160" y="148" class="t e">Timeout ограничивает ожидание.</text>
<text x="160" y="155" class="m e">Он не доказывает, что операция не произошла.</text></g>

<!-- 3 LOSS / UNKNOWN -->
<g><rect x="286" y="51" width="116" height="111" rx="2" class="card"/>
<text x="294" y="66" class="a num">03.</text><text x="307" y="66" class="t ct">LOSS / UNKNOWN</text>
<line x1="294" y1="73" x2="394" y2="73" class="r"/>
<text x="294" y="88" class="m q">Что знает producer после потери связи?</text>
<text x="294" y="101" class="a tag">SCENARIO</text>
<text x="294" y="112" class="m f">producer ─── X ─── consumer</text>
<text x="294" y="126" class="m e">Сообщение могло не дойти.</text>
<text x="294" y="133" class="m e">Но могло и дойти и быть обработано.</text>
<text x="294" y="147" class="a tag">RESULT</text>
<text x="294" y="157" class="t e">UNKNOWN ≠ FAILED</text></g>

<!-- 4 DUPLICATE -->
<g><rect x="18" y="174" width="116" height="111" rx="2" class="card"/>
<text x="26" y="189" class="a num">04.</text><text x="39" y="189" class="t ct">DUPLICATE</text>
<line x1="26" y1="196" x2="126" y2="196" class="r"/>
<text x="26" y="211" class="m q">Что если одно сообщение придёт дважды?</text>
<text x="26" y="224" class="a tag">REDELIVERY</text>
<text x="26" y="235" class="m f">message → process → ACK ✗</text>
<text x="26" y="244" class="m f">message → process again</text>
<text x="26" y="258" class="a tag">ЭФФЕКТ</text>
<text x="26" y="269" class="m e">Один вход может породить повторный effect.</text>
<text x="26" y="279" class="t e">Значит нужен idempotency strategy.</text></g>

<!-- 5 ORDER -->
<g><rect x="152" y="174" width="116" height="111" rx="2" class="card"/>
<text x="160" y="189" class="a num">05.</text><text x="173" y="189" class="t ct">ORDER</text>
<line x1="160" y1="196" x2="260" y2="196" class="r"/>
<text x="160" y="211" class="m q">Где и какой порядок нам гарантирован?</text>
<text x="160" y="224" class="a tag">SEND</text>
<text x="160" y="235" class="m f">1 → 2 → 3</text>
<text x="160" y="245" class="a tag">RECEIVE</text>
<text x="160" y="256" class="m f">1 → 3 → 2</text>
<text x="160" y="269" class="m e">Порядок существует только в заданной</text>
<text x="160" y="276" class="m e">области упорядочивания.</text>
<text x="160" y="286" class="a tag">KEY → ORDERING SCOPE</text></g>

<!-- 6 PARTIAL FAILURE -->
<g><rect x="286" y="174" width="116" height="111" rx="2" class="card"/>
<text x="294" y="189" class="a num">06.</text><text x="307" y="189" class="t ct">PARTIAL FAILURE</text>
<line x1="294" y1="196" x2="394" y2="196" class="r"/>
<text x="294" y="211" class="m q">Что если части операции завершились по-разному?</text>
<text x="294" y="224" class="a tag">EXAMPLE</text>
<text x="294" y="235" class="m f">DB COMMIT ✓</text>
<text x="294" y="244" class="m f">NETWORK     X</text>
<text x="294" y="254" class="m f">CLIENT      ?</text>
<text x="294" y="268" class="a tag">ПРОБЛЕМА</text>
<text x="294" y="279" class="m e">Участники системы имеют разное знание</text>
<text x="294" y="286" class="m e">о результате одной операции.</text></g>
</svg>