<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
<title>05A. DATA MODEL</title>
<desc>Модель данных JobFlow: сущность, идентичность, связи, допустимое состояние, NULL и владелец инварианта.</desc>
<defs><style>
.bg{fill:#0B0D10}.card{fill:#11171D;stroke:#3E4853;stroke-width:.8}.inner{fill:#151B21;stroke:#46515C;stroke-width:.7}.t{fill:#F3F6F8;font-family:Inter,"Segoe UI",Arial,sans-serif}.m{fill:#A2ABB5;font-family:Inter,"Segoe UI",Arial,sans-serif}.a{fill:#7DD3FC}.as{stroke:#7DD3FC;fill:none;stroke-linecap:round;stroke-linejoin:round}.r{stroke:#2A3037;stroke-width:.7}
.title{font-size:17px;font-weight:700;letter-spacing:1.3px}.sub{font-size:4.75px;font-weight:500}.num{font-size:7px;font-weight:800}.ct{font-size:5.8px;font-weight:700;letter-spacing:.48px}.q{font-size:4.05px;font-weight:500}.e{font-size:3.7px;font-weight:500}.f{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:3.4px;font-weight:600}.tag{font-size:3px;font-weight:700;letter-spacing:.45px}.big{font-size:7.3px;font-weight:800}.hero{font-size:6.6px;font-weight:800;letter-spacing:.4px}
</style><marker id="ar" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" class="a"/></marker></defs>
<rect width="420" height="297" class="bg"/>

<!-- Header -->
<text x="18" y="27" class="t title">DATA MODEL</text>
<a href="https://github.com/xakepp35/go_backend_combat"><text x="402" y="27" text-anchor="end" class="m sub">github.com/xakepp35/go_backend_combat</text></a>
<text x="18" y="36" class="m sub">Корректное состояние начинается с модели: сущность → инвариант → constraint → допустимое состояние.</text>
<line x1="18" y1="44" x2="402" y2="44" class="r"/>

<!-- Flow: 1 → 2 → 3 ↘ 4 → 5 → 6 -->
<path d="M134 106H152" class="as" stroke-width="1.9" marker-end="url(#ar)"/>
<path d="M268 106H286" class="as" stroke-width="1.9" marker-end="url(#ar)"/>
<path d="M344 162V168H76V174" class="as" stroke-width="1.9" marker-end="url(#ar)"/>
<path d="M134 229H152" class="as" stroke-width="1.9" marker-end="url(#ar)"/>
<path d="M268 229H286" class="as" stroke-width="1.9" marker-end="url(#ar)"/>

<!-- 1 ENTITY -->
<g><rect x="18" y="51" width="116" height="111" rx="2" class="card"/>
<text x="26" y="66" class="a num">01.</text><text x="39" y="66" class="t ct">ENTITY</text>
<line x1="26" y1="73" x2="126" y2="73" class="r"/>
<text x="26" y="88" class="m q">Что является сущностью системы?</text>
<text x="26" y="101" class="a tag">JOBFLOW</text>
<rect x="26" y="108" width="100" height="38" rx="1.5" class="inner"/>
<text x="32" y="119" class="m f">jobs</text>
<text x="32" y="128" class="m f">id · type · payload</text>
<text x="32" y="137" class="m f">status · created_at</text>
<text x="26" y="157" class="m e">Сущность объединяет состояние, имеющее общий lifecycle.</text></g>

<!-- 2 IDENTITY -->
<g><rect x="152" y="51" width="116" height="111" rx="2" class="card"/>
<text x="160" y="66" class="a num">02.</text><text x="173" y="66" class="t ct">IDENTITY</text>
<line x1="160" y1="73" x2="260" y2="73" class="r"/>
<text x="160" y="88" class="m q">Как однозначно определить строку?</text>
<text x="160" y="101" class="a tag">PRIMARY KEY</text>
<text x="160" y="113" class="m f">id UUID PRIMARY KEY</text>
<text x="160" y="127" class="m e">Identity должна быть однозначной</text>
<text x="160" y="134" class="m e">и стабильной для lifecycle сущности.</text>
<text x="160" y="148" class="a tag">ИНВАРИАНТ</text>
<text x="160" y="157" class="m e">Две разные строки не могут иметь одну identity.</text></g>

<!-- 3 RELATIONSHIP -->
<g><rect x="286" y="51" width="116" height="111" rx="2" class="card"/>
<text x="294" y="66" class="a num">03.</text><text x="307" y="66" class="t ct">RELATIONSHIP</text>
<line x1="294" y1="73" x2="394" y2="73" class="r"/>
<text x="294" y="88" class="m q">Какие связи допустимы между сущностями?</text>
<text x="294" y="101" class="a tag">JOBFLOW</text>
<text x="294" y="114" class="m f">jobs 1 ───── N job_attempts</text>
<text x="294" y="128" class="m f">job_attempts.job_id</text>
<text x="294" y="142" class="m f">→ FOREIGN KEY jobs(id)</text>
<text x="294" y="157" class="m e">Связь должна иметь явную семантику и владельца.</text></g>

<!-- 4 VALID STATE -->
<g><rect x="18" y="174" width="116" height="111" rx="2" class="card"/>
<text x="26" y="189" class="a num">04.</text><text x="39" y="189" class="t ct">VALID STATE</text>
<line x1="26" y1="196" x2="126" y2="196" class="r"/>
<text x="26" y="211" class="m q">Какие состояния данных допустимы?</text>
<text x="26" y="224" class="a tag">CONSTRAINTS</text>
<text x="26" y="235" class="t e">NOT NULL → значение обязательно</text>
<text x="26" y="242" class="t e">UNIQUE → значение уникально</text>
<text x="26" y="249" class="t e">CHECK → правило истинности</text>
<text x="26" y="256" class="t e">FK → связь существует</text>
<text x="26" y="270" class="a tag">ПРИНЦИП</text>
<text x="26" y="279" class="m e">Constraint — исполняемый инвариант.</text></g>

<!-- 5 NULL -->
<g><rect x="152" y="174" width="116" height="111" rx="2" class="card"/>
<text x="160" y="189" class="a num">05.</text><text x="173" y="189" class="t ct">NULL</text>
<line x1="160" y1="196" x2="260" y2="196" class="r"/>
<text x="160" y="211" class="m q">Что означает отсутствие значения?</text>
<text x="160" y="224" class="a tag">NULL ≠ 0 ≠ ""</text>
<text x="160" y="236" class="m e">NULL означает отсутствие значения,</text>
<text x="160" y="243" class="m e">а не конкретное пустое значение.</text>
<text x="160" y="257" class="a tag">SQL</text>
<text x="160" y="268" class="m f">IS NULL</text>
<text x="214" y="268" class="m f">IS NOT NULL</text>
<text x="160" y="280" class="m e">Сравнение с NULL требует специальной семантики.</text></g>

<!-- 6 SOURCE OF TRUTH -->
<g><rect x="286" y="174" width="116" height="111" rx="2" class="card"/>
<text x="294" y="189" class="a num">06.</text><text x="307" y="189" class="t ct">SOURCE OF TRUTH</text>
<line x1="294" y1="196" x2="394" y2="196" class="r"/>
<text x="294" y="211" class="m q">Где должен жить критический инвариант?</text>
<text x="294" y="224" class="a tag">STATE OWNER</text>
<text x="294" y="235" class="m e">Если БД владеет состоянием,</text>
<text x="294" y="242" class="m e">она должна защищать его constraints.</text>
<text x="294" y="255" class="a tag">GO + POSTGRES</text>
<text x="294" y="266" class="m f">Go validation</text>
<text x="294" y="274" class="m f">+</text>
<text x="320" y="274" class="m f">DB constraint</text>
<text x="294" y="282" class="m e">Критический инвариант защищается у владельца.</text></g>
</svg>